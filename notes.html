<style>
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{background:#0e1730;color:#eef2ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;display:flex;flex-direction:column;overscroll-behavior:none}

<script>
const D=[{"t": "Planet Coaster 2 let creators break the game, and kept going after launch", "p": [{"en": "I found this game on Douyin, China's TikTok. Someone had reposted a clip of a guy building a theme park that kills all its guests. It was a few seconds long. I laughed, and I went and played the game. It was Planet Coaster 2, and the clip came from a paid video by RTGame.", "zh": "我是在抖音上发现这款游戏的。有人搬运了一条切片，一个人在建一座会把游客全弄死的游乐园。就几秒钟。我看笑了，然后就去玩了。这款游戏就是 Planet Coaster 2，那条切片来自 RTGame 的一条付费视频。"}, {"en": "That clip is the idea behind my whole presentation. In a building game, the clips that travel are the funny moments. A guest flying off a slide, or a park that kills everyone. You get them in two seconds, even if you've never played. Careful builds mostly stay with the people who already play.", "zh": "这条切片就是我整个演示的核心。在建造类游戏里，能传开的是好笑的瞬间。游客从滑梯上飞出去，或者一座把游客全弄死的乐园。就算从没玩过，两秒钟也能看懂。认真的建造，大多只在本来就玩的人里传。"}, {"en": "Planet Coaster 2 is a theme park builder from Frontier, a studio in Cambridge. It came out in November 2024. I think Frontier wanted two kinds of people. Theme park fans, who were waiting anyway, and people who'd never sit through a building video but would laugh at a park going wrong.", "zh": "Planet Coaster 2 是剑桥的工作室 Frontier 做的游乐园建造游戏，2024 年 11 月发售。我觉得 Frontier 想要两种人。一种是游乐园粉丝，本来就在等。另一种是不会耐心看建造视频、但看到乐园出乱子会笑的人。"}, {"en": "I liked this campaign because Frontier kept handing creators funny moments, at launch and with every update after it.", "zh": "我喜欢这次 campaign，是因为 Frontier 一直在给博主制造好笑的瞬间，发售时是这样，之后每次更新也是这样。"}], "w": 180}, {"t": "Creator selection: at least 18 paid creators, and the six I studied closely", "p": [{"en": "So who did Frontier pay? I found at least 18 paid creators. Of the six whose videos I studied, five are comedy creators. Their whole channel is breaking games for laughs, so they're the people who make funny moments. The sixth is a streamer who plays properly for hours, for people still deciding whether to buy.", "zh": "那 Frontier 付钱给了谁？我找到至少 18 位付费博主。我细看的 6 位里，5 位是搞笑博主，他们的频道就是把游戏玩坏来逗人笑，正好是制造好笑瞬间的人。第 6 位是认真玩好几个小时的主播，给还在考虑买不买的人看。"}, {"en": "My favourite choice is Let's Game It Out. In late November nobody was paying him. He got a free key and made a video on his own, and it has about 7.7 million views now. Three weeks later Frontier paid him to stream the first DLC, and in March they paid him again. They watched him make funny moments first, and then they paid.", "zh": "我最喜欢的选择是 Let's Game It Out。11 月底没人付钱给他，他拿到一个免费 key，自己做了一条视频，现在大约 770 万播放。三周后 Frontier 付钱请他直播第一个 DLC，第二年 3 月又付了一次。他们先看到他能做出好笑的瞬间，然后才付钱。"}, {"en": "Thirteen more creators were invited to a Thorpe Park event before launch. I count them separately, because their posts have no sponsored label or tracked link.", "zh": "另外有 13 位博主在发售前被请去 Thorpe Park 参加活动。我把他们分开算，因为他们的帖子没有赞助标签，也没有专属链接。"}], "w": 146}, {"t": "Creative example: the new feature was the joke", "p": [{"en": "Here's the funny moment I liked most. This is Let's Game It Out's paid video for the third update, and it has about 8.8 million views.", "zh": "这是我最喜欢的一个好笑瞬间。这是 Let's Game It Out 为第三次更新做的付费视频，大约 880 万播放。"}, {"en": "Frontier wanted to show one new feature. If a water slide is too steep, guests fly off the end. At 5:26 he builds the same slide twice. With the feature off, the guest slides down safely. With it on, the guest is launched into the air. That's the product demo, and it's the funniest moment in the video. You get it in two seconds.", "zh": "Frontier 想展示一个新功能：水滑梯太陡的话，游客会从末端飞出去。5:26 他把同一条滑梯建了两次。功能关着，游客平安滑下来。功能开着，游客直接被甩上天。这就是产品演示，也是整条视频最好笑的地方，两秒钟就能看懂。"}, {"en": "He says it's sponsored at the start and never stops for an ad read after that. He didn't need to, because the feature was the joke.", "zh": "他开头说了是赞助，之后一次也没停下来念广告。他也不需要停，因为新功能本身就是笑点。"}, {"en": "The rest is a park where nobody survives. You see a lot of the game, but nobody teaches you to play it.", "zh": "剩下的时间是一座没人能活下来的乐园。你能看到游戏的很多内容，但没人教你怎么玩。"}, {"en": "My guess is the brief was one feature and a lot of freedom. Frontier did the same before launch. At Thorpe Park, 13 creators rode a real coaster blindfolded, then rebuilt it in the game from memory. Both times, Frontier designed the moment, and the creators made it funny.", "zh": "我猜 brief 就是一个要展示的功能，加上很大的自由度。Frontier 在发售前也这样做过。在 Thorpe Park，13 位博主蒙着眼坐真的过山车，再凭记忆在游戏里把它建出来。两次都是 Frontier 设计好瞬间，博主把它变好笑。"}], "w": 187}, {"t": "Campaign beats: after launch, paid creators came with a DLC, an update or a sale", "p": [{"en": "On the timeline, the pattern is that every update gave creators something new to make funny. Before launch it was mostly press and the Thorpe Park event. Launch week had five paid Twitch streams and RTGame's death park. After launch, the first DLC in December, the third update in March and a summer sale in July each came with paid creators.", "zh": "时间线上能看出一个规律：每次更新都给了博主一个可以拿来搞笑的新东西。发售前主要是媒体和 Thorpe Park 活动。发售周有 5 场付费 Twitch 直播和 RTGame 的死亡乐园。发售后，12 月第一个 DLC、3 月第三次更新、7 月夏季打折，每一次都有付费博主跟着发。"}, {"en": "The game got better too. Reviews went from 68% positive at launch to 83% after the third update.", "zh": "游戏本身也变好了，好评率从发售时的 68% 涨到了第三次更新后的 83%。"}, {"en": "The one thing I'd fix is timing. Picture someone watching the slide video, opening Steam, and finding the sale had ended eight days earlier. I'd put the update, the sale and the video on the same day.", "zh": "我唯一想改的是时机。想象一下，有人看完那条滑梯视频，打开 Steam，发现打折 8 天前就结束了。我会把更新、打折和视频放在同一天。"}], "w": 116}, {"t": "Platform approach: each platform had its own job", "p": [{"en": "The platforms show the same thing. YouTube had most of the paid views, about 10 million across seven videos. A long video gives the moment a story, from an empty field to a disaster. Twitch was for people who wanted to watch before buying.", "zh": "平台上也是同一个规律。YouTube 占了大部分付费播放，7 条视频约 1,000 万。长视频能给瞬间配一个故事，从一片空地拍到一场灾难。Twitch 给想先看再买的人。"}, {"en": "On Instagram I found the clearest proof. This account has 33,000 followers. It only posts Planet Coaster 2 water slides from the rider's seat, with titles like \"You won't believe what this slide did to me\". Its typical reel gets about 300,000 views, and its biggest got 56 million. When I searched Instagram for Planet Coaster 2, the funny, over-the-top clips had around 33,000 likes each, and the careful builds had around 160.", "zh": "最清楚的证据在 Instagram。这个账号只有 3.3 万粉丝，只发 Planet Coaster 2 的水滑梯第一视角，标题像「你不会相信这条滑梯对我做了什么」。它一条普通的 reel 有大约 30 万播放，最高一条 5,600 万。我在 Instagram 搜 Planet Coaster 2，好笑、夸张的帖子每条大约 3.3 万赞，认真建造的大约 160 个。"}, {"en": "So I'd find the small accounts already making these clips, pay for the right to use them, and run them as Spark Ads with the game's name on screen.", "zh": "所以我会找到已经在做这种片段的小账号，付钱买片段的使用权，用 Spark Ads 投出去，并把游戏名字打在画面上。"}], "w": 147}, {"t": "Assessment: what worked, what didn't, and how I'd measure it", "p": [{"en": "Did the funny moments work? Across the top, it hit number one on Steam at launch and sold more than 600,000 copies by September 2025. Nobody outside Frontier can see sales by creator, so I looked at what I could.", "zh": "这些好笑的瞬间起作用了吗？最上面一排，发售时登上 Steam 榜第一，到 2025 年 9 月卖了 60 万份以上。Frontier 以外的人看不到每个博主卖了多少，所以我查了能查到的。"}, {"en": "The day after the slide video, YouTube searches for the game hit their highest point in six weeks. And that video kept growing for months, so I'd judge a creator at 60 to 90 days, not on a first-week report.", "zh": "滑梯视频发出的第二天，这款游戏的 YouTube 搜索量到了六周里的最高点。而且那条视频持续涨了好几个月，所以我会在 60 到 90 天后再评估博主，不只看第一周的报告。"}, {"en": "The pink box is the main miss, the eight days. Below it, three more. None of the paid videos taught the game, and almost a quarter of new players' complaints say it's hard to learn, so I'd add one creator who teaches. I can't prove from outside how much creators added, so I'd test them in one market against another. And short clips were mostly left to fans, so I'd pay for them.", "zh": "粉色框是最主要的失误，就是那 8 天。下面还有三个。付费视频没有一条教人玩，而新玩家的差评里将近四分之一说难上手，所以我会加一位教人玩的博主。从外面我证明不了博主多带来了多少，所以我会在一个市场投、和另一个市场比。短视频大多交给了粉丝自己做，所以我会付钱买。"}, {"en": "For metrics I'd keep three. Views against the creator's normal, interest like searches and wishlists, and sales through links and codes.", "zh": "指标我只看三个：播放和博主平时的水平比，兴趣看搜索量和愿望单，销量看链接和代码。"}], "w": 174}, {"t": "For SEGA: Two Point Museum's next DLC, built on funny moments", "p": [{"en": "For SEGA I'd take this to Two Point Museum's next DLC. The roadmap says it's coming early next year and it's the biggest one yet, with Twitch Drops from 1 December and a free update before it. The theme isn't public, so I'm assuming it has one headline feature, like every pack so far.", "zh": "放到 SEGA，我会用在 Two Point Museum 的下一个 DLC 上。官方路线图说它明年初上线，是最大的一个，之前还有 12 月 1 日开始的 Twitch Drops 和一次免费更新。主题还没公布，所以我假设它和之前每个 DLC 一样，有一个主打的新功能。"}, {"en": "Two Point is already a comedy game, so this idea fits it even better than Planet Coaster. Step one is to find the funny moment. I'd ask the studio which part of the new feature goes wrong in a funny way by design, so it looks like a joke and doesn't look like a bug. Then I'd give it to comedy creators. Before I rebook anyone, I'd check them with Creator Signal, a small tool I built. SEGA's two paid creators on this game got 1.6 and 0.6 times their normal views.", "zh": "Two Point 本来就是搞笑游戏，所以这个思路比用在 Planet Coaster 上还合适。第一步是找到那个好笑的瞬间。我会问工作室，新功能里哪部分是设计好会出好笑状况的，这样看起来是笑点，不像 bug。然后交给搞笑博主。再约任何人之前，我会先用我做的小工具 Creator Signal 查一下。SEGA 为这款游戏请过的两位博主，分别拿到了平时的 1.6 倍和 0.6 倍。"}, {"en": "There's one more group with its own funny moments. Museum and history people already post about this game for free. A real palaeontologist reacting to the game's fossils is exactly the kind of clip that travels. I'd book small history channels for that, and host them at a real museum first, the way Frontier used Thorpe Park.", "zh": "还有一群人有他们自己的好笑瞬间。博物馆和历史圈的人已经在免费发这款游戏的内容了。一位真的古生物学者点评游戏里的化石，正是能传开的那种片段。我会请小型历史频道来做这个，先把他们请到一家真的博物馆，就像 Frontier 用 Thorpe Park 那样。"}], "w": 203}, {"t": "For SEGA: free keys first, pay for what works, and measure it properly", "p": [{"en": "Here's how I'd run it. Free keys go out first, and I watch who makes a funny moment people share, the way Frontier did with Let's Game It Out. Then I pay.", "zh": "我会这样执行。先发免费 key，看谁做出了大家愿意转发的好笑瞬间，就像 Frontier 对 Let's Game It Out 那样。然后再付钱。"}, {"en": "In this example budget of £40,000, £15,000 goes to comedy creators on YouTube and £13,000 to ten history channels. £4,000 goes to Twitch for the Drops. £3,000 is for short clips. TikTok and Instagram Reels use the same vertical format, and most TikTok creators also run Instagram. So when I book a TikTok creator, I'd add a small fee to post the same clip as a Reel. I'd keep £5,000 back, so if a clip takes off I can put more behind it straight away.", "zh": "这个 4 万英镑的示例预算里，1.5 万给 YouTube 上的搞笑博主，1.3 万给 10 个历史频道，4,000 给 Twitch 配合 Drops，3,000 用在短视频上。TikTok 和 Instagram Reels 是同一种竖屏格式，大部分 TikTok 博主也有 Instagram 账号。所以签 TikTok 博主时，我会多加一点钱，让他把同一条视频也发到 Reels 上。我会留 5,000，如果某个片段起量了，可以马上追加。"}, {"en": "The update, the sale and the videos go out on the same day, and that date and the Ad label go in every contract.", "zh": "更新、打折和视频放在同一天发，这个日期和 Ad 标注写进每一份合同。"}, {"en": "I'd need keys and sale dates from Product Marketing, the studio to tell me where the funny moment is, Studio Brand to approve it, and Community to point me to the accounts already making clips.", "zh": "这些需要 Product Marketing 给 key 和打折日期，工作室告诉我好笑的瞬间在哪里，Studio Brand 审核，Community 告诉我哪些账号已经在做这种片段。"}, {"en": "That's my plan. Happy to take questions.", "zh": "这就是我的方案，欢迎提问。"}], "w": 183}];
let i=0, deck=null, t0=null, s0=null;
const $=id=>document.getElementById(id), main=$('main');
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function render(){
  $('num').textContent=(i+1)+' / '+D.length; $('title').textContent=D[i].t+'  ·  about '+(D[i].w/140).toFixed(1)+' min';
  main.innerHTML=D[i].p.map(p=>{ const m=p.en.match(/^(.{0,60}?[.,:])\s/); 
    return '<p>'+p.en.replace(/^((?:On the (?:left|right)[^.,]*|Under the table, box \w+|Box(?:es)? \w+(?: and \w+)?(?: on the right)?|The (?:pink|yellow) (?:box|rows?)|The table on the (?:left|right)|Row three|Bottom left|At the bottom|Below it|First, the results, across the top|The facts are (?:on the left|across the top)))/,'<b>$1</b>')+'</p><p class="zh">'+p.zh+'</p>'; }).join('');
  main.scrollTop=0; fit(); s0=Date.now();
}
function fit(){ let lo=13, hi=Math.min(34, innerWidth/18); for(let k=0;k<9;k++){ const m=(lo+hi)/2; main.style.fontSize=m+'px'; if(main.scrollHeight>main.clientHeight+1) hi=m; else lo=m; } main.style.fontSize=lo+'px'; }
function go(n,fromDeck){ if(n<0||n>=D.length) return; if(t0===null) t0=Date.now(); i=n; render(); if(!fromDeck&&deck&&!deck.closed) deck.postMessage({type:'go',i:n},'*'); }
addEventListener('keydown',e=>{ if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){ e.preventDefault(); go(i+1); } if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(i-1); } });
$('next').onclick=()=>go(i+1); $('prev').onclick=()=>go(i-1);
main.addEventListener('click',e=>{ const x=e.clientX/innerWidth; if(x>.8) go(i+1); else if(x<.2) go(i-1); });
$('zhBtn').onclick=()=>{ document.body.classList.toggle('zh'); $('zhBtn').classList.toggle('on'); fit(); };
$('resetBtn').onclick=()=>{ t0=null; s0=Date.now(); tick(); };
$('deckBtn').onclick=()=>{ deck=window.open('index.html','sega_deck','width=1280,height=760'); $('deckBtn').classList.add('on'); $('deckBtn').textContent='Deck open'; setTimeout(()=>{ if(deck) deck.postMessage({type:'go',i:i},'*'); },2500); };
addEventListener('message',e=>{ if(e.data&&e.data.type==='at'&&typeof e.data.i==='number'&&e.data.i>=0&&e.data.i!==i) go(e.data.i,true); });
function tick(){ const now=Date.now(); $('slideT').textContent=mmss(s0?(now-s0)/1000:0); const tot=t0?(now-t0)/1000:0; $('totalT').textContent='total '+mmss(tot); $('totalT').classList.toggle('over',tot>15*60); $('slideT').classList.toggle('over', s0&&(now-s0)/1000>D[i].w/140*60*1.15); }
setInterval(tick,500); addEventListener('resize',fit); render();
</script></body></html>

<script>
const D=[{"t": "Planet Coaster 2 let creators break the game, and kept going after launch", "p": [{"en": "I found this game on Douyin, China's TikTok. Someone had reposted a few seconds of a guy building a theme park that kills all its guests. I laughed, and I went and played it. The game was Planet Coaster 2, and the clip came from a paid video by RTGame.", "zh": "我是在抖音上发现这款游戏的。有人搬运了几秒钟的片段，一个人在建一座会把游客全弄死的游乐园。我看笑了，就去玩了。这款游戏就是 Planet Coaster 2，那条片段来自 RTGame 的一条付费视频。"}, {"en": "That clip is the idea behind this whole presentation. In a building game, the clips that travel are the funny moments, like a guest flying off a slide. You get them in two seconds, even if you've never played. Careful builds mostly stay with people who already play.", "zh": "这条片段就是我整个演示的核心。在建造类游戏里，能传开的是好笑的瞬间，比如游客从滑梯上飞出去。就算从没玩过，两秒钟也能看懂。认真的建造，大多只在本来就玩的人里传。"}, {"en": "Planet Coaster 2 is a theme park builder from Frontier in Cambridge, out in November 2024. The launch was rough. I counted the Steam reviews from the first 30 days, and only 68% were positive. So the game couldn't sell on its reviews. It needed clips that make people laugh and go and look it up, the way I did.", "zh": "Planet Coaster 2 是剑桥的 Frontier 做的游乐园建造游戏，2024 年 11 月发售。发售时口碑不好，我数了头 30 天的 Steam 评测，好评只有 68%。所以这款游戏靠评价卖不动，它需要能让人笑出来、再去搜一下的片段，就像我当时那样。"}, {"en": "I liked this campaign because Frontier kept handing creators funny moments after launch. Two thirds of the paid creators I found posted after launch week, each time around a DLC, an update or a sale.", "zh": "我喜欢这次 campaign，是因为 Frontier 发售后一直在给博主制造好笑的瞬间。我找到的付费博主里，三分之二是在发售周之后发的，每次都围绕一个 DLC、一次更新或一次打折。"}], "w": 193}, {"t": "Creator selection: at least 18 paid creators, and the six I studied closely", "p": [{"en": "Frontier bet on funny moments when it picked creators. I found at least 18 paid ones, by checking video descriptions for an ad label and for Frontier's tracked links, which all start with fron.dev. Of the six whose videos I could study, five are comedy channels. Their viewers come to watch a game go wrong. The sixth, CohhCarnage, plays properly for hours on launch day, for people deciding whether to buy.", "zh": "Frontier 选博主的时候，押的就是好笑的瞬间。我找到至少 18 位付费博主，方法是逐条看视频简介里有没有广告标注，有没有 Frontier 的专属链接（都以 fron.dev 开头）。我能细看视频的 6 位里，5 位是搞笑频道，观众就是来看游戏被玩坏的。第 6 位 CohhCarnage 在发售日认真玩好几个小时，给还在考虑买不买的人看。"}, {"en": "The numbers show which creator made the funny moments work. Let's Game It Out's channel is built on breaking simulation games. His two videos on this game, one free and one paid, have about 16.5 million views. The other five paid videos on this page have about 1.3 million together. DanTDM has more than four times his subscribers, and got 700,000.", "zh": "数字能看出是哪位博主把好笑的瞬间做成了。Let's Game It Out 的频道就是专门把模拟类游戏玩坏的。他在这款游戏上的两条视频，一条免费、一条付费，加起来大约 1,650 万播放。这一页另外 5 条付费视频加起来只有大约 130 万。DanTDM 的订阅数是他的四倍多，播放是 70 万。"}, {"en": "Frontier found him the right way. In late November nobody was paying him. He got a free key and made a video on his own, which now has 7.7 million views. Three weeks later Frontier paid him to stream the first DLC, and in March they paid him again. They watched him make funny moments first, and then they paid.", "zh": "Frontier 找到他的方式也对。11 月底没人付钱给他，他拿到一个免费 key，自己做了一条视频，现在 770 万播放。三周后 Frontier 付钱请他直播第一个 DLC，3 月又付了一次。他们先看到他能做出好笑的瞬间，然后才付钱。"}], "w": 192}, {"t": "Creative example: the new feature was the joke", "p": [{"en": "This is the funny moment I liked most. It's Let's Game It Out's paid video for the third update, with 8.8 million views.", "zh": "这是我最喜欢的一个好笑瞬间。这是 Let's Game It Out 为第三次更新做的付费视频，880 万播放。"}, {"en": "Frontier wanted to show one new feature. If a water slide is too steep or too fast, guests get launched off it. At 11:01 he builds a roller coaster to catch a flying guest in mid-air. The guest flies off the slide, the coaster races past, and it grabs his inner tube and leaves him behind. That's the product demo, and it's the funniest moment in the video.", "zh": "Frontier 想展示一个新功能：水滑梯太陡或太快，游客就会被甩出去。11:01 他建了一条过山车，想在半空接住飞出来的游客。游客从滑梯上飞出去，过山车冲过去，只捞走了他的皮圈，把人留在半空。这就是产品演示，也是整条视频最好笑的地方。"}, {"en": "I timed it. The sponsor mention takes about 25 seconds at the start, and he never stops for an ad read after that. The new slides are on screen for about ten of the fifteen minutes. He didn't need an ad read, because the feature was the joke.", "zh": "我给视频计了时。开头讲赞助大约 25 秒，之后一次也没停下来念广告。新滑梯在 15 分钟里出现了大约 10 分钟。他不需要念广告，因为新功能本身就是笑点。"}, {"en": "The video doesn't teach you to build, though. I'll come back to that on page 6.", "zh": "不过这条视频不教你怎么建。第 6 页我会再说这一点。"}, {"en": "My guess is the brief was one feature and a lot of freedom. Frontier did the same before launch. At Thorpe Park, 13 creators rode a real coaster blindfolded and then rebuilt it in the game from memory. Both times Frontier set up the moment, and the creators made it funny.", "zh": "我猜 brief 就是一个要展示的功能，加上很大的自由度。Frontier 在发售前也这样做过。在 Thorpe Park，13 位博主蒙着眼坐真的过山车，再凭记忆在游戏里建出来。两次都是 Frontier 把瞬间设计好，博主把它变好笑。"}], "w": 206}, {"t": "Campaign beats: after launch, paid creators came with a DLC, an update or a sale", "p": [{"en": "On the timeline, every update gave creators a new thing to break, and that's where the big numbers came from.", "zh": "时间线上能看出来，每次更新都给了博主一个可以玩坏的新东西，大播放量也都是从这里来的。"}, {"en": "Before launch it was press and the Thorpe Park event. I found 17 creator posts from the event, about 343,000 views together. One funny video built around Update 3 got 8.8 million. So I read the event as a way to get press and wishlists, and the funny update videos as what got the big views.", "zh": "发售前主要是媒体和 Thorpe Park 活动。我找到活动的 17 条博主帖子，加起来大约 34.3 万播放。而一条围绕 Update 3 的搞笑视频就有 880 万。所以我认为活动的作用是拿媒体报道和愿望单，大播放量靠的是跟着更新发的搞笑视频。"}, {"en": "After launch, the first DLC in December, the third update in March and the summer sale in July each came with paid creators. Each one gave them something new to break. The game got better too. I grouped 15,301 Steam reviews by date, and they went from 68% positive at launch to 83% after the third update.", "zh": "发售后，12 月第一个 DLC、3 月第三次更新、7 月夏季打折，每次都有付费博主跟着发，每次都给了他们新东西去玩坏。游戏本身也变好了。我把 15,301 条 Steam 评测按日期分组，好评从发售时的 68% 涨到第三次更新后的 83%。"}, {"en": "The one thing I'd fix is timing. The Update 3 video came out eight days after the sale ended. Picture laughing at that coaster, opening Steam, and finding the full price. I'd put the update, the sale and the video on the same day.", "zh": "我唯一想改的是时机。Update 3 的视频在打折结束 8 天后才发。想象一下，你刚看完过山车那段笑完，打开 Steam，看到的是原价。我会把更新、打折和视频放在同一天。"}], "w": 177}, {"t": "Platform approach: each platform had its own job", "p": [{"en": "Each platform did a different job. YouTube had most of the paid views, about 10 million across seven videos, because a long video can build up to the funny moment. Twitch was for people who wanted to watch normal play before buying. TikTok had 12 paid posts I could find, about 3.4 million views together.", "zh": "每个平台各有分工。YouTube 占了大部分付费播放，7 条视频大约 1,000 万，因为长视频可以一步步铺垫到那个好笑的瞬间。Twitch 给想先看正常玩法再买的人。TikTok 我找到 12 条付费帖子，加起来大约 340 万播放。"}, {"en": "Instagram is where funny clips do best. The biggest Planet Coaster 2 reels are funny slide rides from small accounts. This one has 33,000 followers, and its biggest reel got 56 million views. Careful builds, like the account at the bottom, get around 7,000. In a search for the game, the funny posts had about 200 times the likes of the careful builds.", "zh": "在 Instagram 上，好笑的片段表现最好。Planet Coaster 2 播放最高的 reels，都是小账号发的搞笑滑梯第一视角。这个账号只有 3.3 万粉丝，最高一条 5,600 万播放。认真建造的，比如表格最下面那个账号，大约 7,000。在 Instagram 搜这款游戏，搞笑帖子的点赞是认真建造帖子的大约 200 倍。"}, {"en": "So I'd find the accounts already making these clips, pay for the rights, and run them as Spark Ads and Reels ads with the game's name on screen.", "zh": "所以我会找到已经在做这种片段的账号，付钱买使用权，用 Spark Ads 和 Reels 广告投出去，把游戏名字打在画面上。"}], "w": 146}, {"t": "Assessment: what worked, what didn't, and how I'd measure it", "p": [{"en": "To judge whether the funny moments worked, I checked what I could see by day, with Google Trends, SteamDB, the web archive and the Steam reviews. Nobody outside Frontier can see sales by creator. Frontier says it sold over 600,000 copies by September 2025.", "zh": "要判断这些好笑的瞬间有没有起作用，我用 Google Trends、SteamDB、网页存档和 Steam 评测，按天查了能看到的。Frontier 以外的人看不到每个博主卖了多少。Frontier 说到 2025 年 9 月卖了 60 万份以上。"}, {"en": "Three things worked. The day after his Update 3 video went up, YouTube searches for the game hit their highest point from March to mid-April. The video also kept travelling. On day six it had about 2 million views, only 23% of what it has now. And on SteamDB, players rose with every update, DLC and discount, so the clips work best when they land on one of those days.", "zh": "有三点起作用了。他那条 Update 3 视频发出第二天，这款游戏的 YouTube 搜索量到了 3 月到 4 月中旬的最高点。这条视频还一直在传，第 6 天大约 200 万播放，只是现在的 23%。另外在 SteamDB 上，在线人数每逢更新、DLC 和打折就涨，所以片段落在这些日子上效果最好。"}, {"en": "Two things didn't. The pink box is the main one. People laughed while the game was full price, because the video came eight days after the sale. And the funny clips brought people in, and then nobody taught them to play. About a quarter of the negative reviews from players with under five hours say the tools or the tutorial are confusing. So I'd add one creator who teaches.", "zh": "有两点没做好。粉色框是最主要的：视频在打折结束 8 天后才发，大家笑的时候，游戏是原价。还有，好笑的片段把人带进来了，之后却没人教他们怎么玩。游戏时长不到 5 小时的玩家写的差评里，大约四分之一说工具或教程看不懂。所以我会加一位教人玩的博主。"}, {"en": "To measure the next campaign, I'd look first at whether the moment travelled. That's views against the creator's normal, and shares, because a funny clip spreads through shares. Then whether people got curious, so searches for the game, Steam wishlists and follows, and comments asking what the game is. Then sales, through each creator's link and code, plus the lift against two quiet weeks before we start. And I'd check again at 60 to 90 days, because a funny video keeps travelling.", "zh": "下一次 campaign 怎么衡量：先看这个瞬间有没有传开，就是播放和博主平时的水平比，再看分享，因为好笑的片段是靠分享传开的。然后看大家有没有好奇，就是游戏的搜索量、Steam 愿望单和关注，还有评论里问「这是什么游戏」的。最后看销量，看每位博主的链接和代码，再和开始前两周（没有打折、没有更新）比多卖了多少。60 到 90 天后我会再看一次，因为好笑的视频会一直传。"}], "w": 265}, {"t": "For SEGA: Two Point Museum's next DLC, built on funny moments", "p": [{"en": "So in a building and management game, the funny moments bring the views. The coaster video alone got 8.8 million, and on Instagram the funny clips beat careful builds many times over. SEGA makes management games too, and Two Point Museum has a big release coming. The official roadmap from 20 November says the next DLC comes early next year and it's their biggest yet, with Twitch Drops from 1 December before it. The theme isn't public, so I'm assuming one headline feature, like every pack before it.", "zh": "所以在建造经营类游戏里，大播放量来自好笑的瞬间。光是过山车那条视频就有 880 万，Instagram 上搞笑片段的点赞也是认真建造的好多倍。SEGA 也做经营类游戏，Two Point Museum 马上有一个大更新。11 月 20 日的官方路线图说，下一个 DLC 明年初上线，是他们最大的一个，之前 12 月 1 日先开始 Twitch Drops。主题还没公布，所以我假设它和之前每个 DLC 一样，有一个主打的新功能。"}, {"en": "Two Point is already a comedy game, so this fits it even better than Planet Coaster. Step one is to find the funny moment. I'd ask the studio which part of the new feature goes wrong in a funny way by design, so it looks like a joke and doesn't look like a bug. Then I'd give it to comedy creators. Before I book anyone again, I'd check them with Creator Signal, a small tool I built. It compares a sponsored video with that creator's normal views. SEGA's two paid creators on this game came out at 1.6 times and 0.6 times their normal, so I'd know whose moment travelled.", "zh": "Two Point 本来就是搞笑游戏，所以这个思路比用在 Planet Coaster 上还合适。第一步是找到那个好笑的瞬间。我会问工作室，新功能里哪部分是设计好会出好笑状况的，这样看起来是笑点，不像 bug。然后交给搞笑博主。再约任何人之前，我会先用我做的小工具 Creator Signal 查一下，它拿一条赞助视频和这个博主平时的播放比。SEGA 为这款游戏请过的两位博主，分别是平时的 1.6 倍和 0.6 倍，这样我就知道谁的瞬间传开了。"}, {"en": "I'd add one more group, history creators, and it doesn't clash with the comedy. The game's exhibits are silly takes on real fossils and artefacts, so an expert reacting to them is a funny moment too. It also reaches people who follow history channels and may never watch a gaming channel. Some already post about the game unpaid, like a palaeontologist reacting to its fossils. I'd book ten small history channels and host them at a real museum first, so they can compare the real thing with the game, the way Frontier used Thorpe Park. The Pitt Rivers in Oxford would work.", "zh": "我还会加一类博主：历史博主。这和搞笑不冲突。游戏里的展品都是真实化石和文物的搞笑版本，所以专家看到它们的反应，本身就是一个好笑的瞬间。而且能触达那些关注历史频道、可能从来不看游戏频道的人。已经有人在免费发这款游戏的内容了，比如一位古生物学者点评游戏里的化石。我会约 10 个小型历史频道，先把他们请到一家真的博物馆，让他们能拿真东西和游戏比，就像 Frontier 用 Thorpe Park 那样。牛津的 Pitt Rivers 博物馆就合适。"}], "w": 300}, {"t": "For SEGA: free keys first, pay for what works, and measure it properly", "p": [{"en": "The plan follows the funny moments. Free keys go out first, and I watch who makes a moment people share, the way Frontier did with Let's Game It Out. Then I pay.", "zh": "整个方案围绕好笑的瞬间来排。先发免费 key，看谁做出了大家愿意转发的瞬间，就像 Frontier 对 Let's Game It Out 那样。然后再付钱。"}, {"en": "In this example budget of £40,000, the biggest line, £15,000, goes to comedy creators on YouTube who get the DLC's funny moment first. At Gamesight's public rate of 8 to 10 US cents a view, that's about three full videos. £13,000 goes to the ten history channels. £4,000 goes to Twitch for the Drops, for people who want to see normal play.", "zh": "这个 4 万英镑的示例预算里，最大的一笔 1.5 万给 YouTube 上最先拿到 DLC 好笑瞬间的搞笑博主。按 Gamesight 公开的每次播放 8 到 10 美分算，大约是 3 条完整视频。1.3 万给 10 个历史频道。4,000 给 Twitch 配合 Drops，给想看正常玩法的人。"}, {"en": "Short video works differently. This role runs TikTok's Gaming Incentive Programme for SEGA in EMEA. As I understand it, SEGA funds a pool, creators sign up in TikTok Studio, post to our brief, and get paid by qualified views. That suits funny clips, because the biggest ones come from small accounts, and it pays them for the views they get. The brief would be the DLC's funny moment. I've kept the pool outside this example, because I don't know how SEGA funds it.", "zh": "短视频的做法不一样。这个岗位负责 SEGA 在 EMEA 的 TikTok Gaming Incentive Programme。据我了解，SEGA 出一个奖金池，创作者在 TikTok Studio 报名，按我们的 brief 发视频，再按合格播放量拿钱。这很适合好笑的片段，因为最火的片段都来自小账号，而它按实际播放给他们付钱。brief 就写 DLC 的那个好笑瞬间。奖金池我没算进这个示例预算，因为我不知道 SEGA 怎么给它出钱。"}, {"en": "The £3,000 is for Spark Ads, with no big creator deals. I'd pay the small accounts whose clips do best for the right to boost them, plus the ad spend. Most TikTok creators also run Instagram, so I'd add a small fee for the same clip as a Reel. And I'd keep £5,000 back. Only about three in ten creator videos pay back, so when a clip takes off I can put more behind it straight away.", "zh": "那 3,000 英镑是投 Spark Ads 的，不签大博主。我会给片段表现最好的小账号付钱，买下投放的权利，再加上投放费。大部分 TikTok 博主也有 Instagram，所以我会多加一点钱，让同一条也发到 Reels。我还会留 5,000。博主视频大约十条里只有三条能回本，所以哪条片段起量了，我可以马上追加。"}, {"en": "The update, the sale and the videos go out on the same day, and that date and the Ad label go in every contract.", "zh": "更新、打折和视频放在同一天发，这个日期和 Ad 标注写进每一份合同。"}, {"en": "I'd need keys and sale dates from Product Marketing, the studio to point me to the funny moment, Studio Brand to approve it, and Community to point me to the accounts already making clips.", "zh": "这些需要 Product Marketing 给 key 和打折日期，工作室告诉我好笑的瞬间在哪，Studio Brand 审核，Community 告诉我哪些账号已经在做这种片段。"}, {"en": "That's my plan. Happy to take questions.", "zh": "这就是我的方案，欢迎提问。"}], "w": 319}];
let i=0, deck=null, t0=null, s0=null;
const $=id=>document.getElementById(id), main=$('main');
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function render(){
  $('num').textContent=(i+1)+' / '+D.length; $('title').textContent=D[i].t+'  ·  about '+(D[i].w/140).toFixed(1)+' min';
  main.innerHTML=D[i].p.map(p=>{ const m=p.en.match(/^(.{0,60}?[.,:])\s/); 
    return '<p>'+p.en.replace(/^((?:On the (?:left|right)[^.,]*|Under the table, box \w+|Box(?:es)? \w+(?: and \w+)?(?: on the right)?|The (?:pink|yellow) (?:box|rows?)|The table on the (?:left|right)|Row three|Bottom left|At the bottom|Below it|First, the results, across the top|The facts are (?:on the left|across the top)))/,'<b>$1</b>')+'</p><p class="zh">'+p.zh+'</p>'; }).join('');
  main.scrollTop=0; fit(); s0=Date.now();
}
function fit(){ let lo=13, hi=Math.min(34, innerWidth/18); for(let k=0;k<9;k++){ const m=(lo+hi)/2; main.style.fontSize=m+'px'; if(main.scrollHeight>main.clientHeight+1) hi=m; else lo=m; } main.style.fontSize=lo+'px'; }
function go(n,fromDeck){ if(n<0||n>=D.length) return; if(t0===null) t0=Date.now(); i=n; render(); if(!fromDeck&&deck&&!deck.closed) deck.postMessage({type:'go',i:n},'*'); }
addEventListener('keydown',e=>{ if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){ e.preventDefault(); go(i+1); } if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(i-1); } });
$('next').onclick=()=>go(i+1); $('prev').onclick=()=>go(i-1);
main.addEventListener('click',e=>{ const x=e.clientX/innerWidth; if(x>.8) go(i+1); else if(x<.2) go(i-1); });
$('zhBtn').onclick=()=>{ document.body.classList.toggle('zh'); $('zhBtn').classList.toggle('on'); fit(); };
$('resetBtn').onclick=()=>{ t0=null; s0=Date.now(); tick(); };
$('deckBtn').onclick=()=>{ deck=window.open('index.html','sega_deck','width=1280,height=760'); $('deckBtn').classList.add('on'); $('deckBtn').textContent='Deck open'; setTimeout(()=>{ if(deck) deck.postMessage({type:'go',i:i},'*'); },2500); };
addEventListener('message',e=>{ if(e.data&&e.data.type==='at'&&typeof e.data.i==='number'&&e.data.i>=0&&e.data.i!==i) go(e.data.i,true); });
function tick(){ const now=Date.now(); $('slideT').textContent=mmss(s0?(now-s0)/1000:0); const tot=t0?(now-t0)/1000:0; $('totalT').textContent='total '+mmss(tot); $('totalT').classList.toggle('over',tot>15*60); $('slideT').classList.toggle('over', s0&&(now-s0)/1000>D[i].w/140*60*1.15); }
setInterval(tick,500); addEventListener('resize',fit); render();
</script></body></html>

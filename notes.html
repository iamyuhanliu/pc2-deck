<script>
const D=[{"t": "Planet Coaster 2 let creators break the game, and kept going after launch", "p": [{"en": "I found this game on Douyin, China's TikTok. Someone had reposted a clip of a guy building a theme park that kills all its guests. I laughed, and I went and played the game. It was Planet Coaster 2. Later I found out the clip came from a paid video by RTGame. He's on the next slide.", "zh": "我是在抖音上发现这款游戏的。有人搬运了一条切片，一个人在建一座会把游客全弄死的游乐园。我看笑了，就去玩了这个游戏。它就是 Planet Coaster 2。后来我才知道，那条切片来自 RTGame 的一条付费视频。下一页就有他。"}, {"en": "The facts are on the left. Planet Coaster 2 is a theme park builder from Frontier, a studio in Cambridge. It came out in November 2024, and the big new thing was water parks.", "zh": "左边是基本信息。Planet Coaster 2 是 Frontier 做的建游乐园游戏，工作室在剑桥。它 2024 年 11 月发售，最大的新内容是水上乐园。"}, {"en": "On the right, who it was for. I think Frontier wanted two kinds of people. The first is theme park fans, who were waiting for the sequel anyway. The second is people who don't normally play building games. Five of the six creators I studied make comedy videos where they break the game. You can laugh at that without knowing how to build anything.", "zh": "右边先看它是给谁看的。我认为 Frontier 想要两种人。第一种是游乐园游戏的粉丝，他们本来就在等续作。第二种是平时不玩建造游戏的人。我细看的 6 位博主里，有 5 位做的是把游戏玩坏的搞笑视频。看这种视频，不会建东西也能笑出来。"}, {"en": "So I think the campaign had two jobs. At launch, reach people beyond the fans. After launch, bring people back when the game got better.", "zh": "所以我认为这次 campaign 有两个任务。发售时，触达粉丝以外的人。发售后，游戏变好了，把人带回来。"}, {"en": "The pink box is why I liked it. First, it worked on me. A funny clip made me go and play the game. Second, Frontier didn't stop after launch. Reviews were mixed at launch, at 68% positive. Each big update then came with paid creators, and their YouTube videos have about 10 million views. After the third update, reviews were 83% positive, and Frontier says the game has sold more than 600,000 copies.", "zh": "粉色框是我喜欢它的原因。第一，它对我起作用了。一条好笑的切片让我去玩了这个游戏。第二，Frontier 发售之后没有停。上线时评价一般，好评率 68%。之后每次大更新都配了付费博主，他们的 YouTube 视频合计约 1,000 万播放。第三次更新之后，好评率到了 83%，Frontier 说游戏卖了 60 万份以上。"}], "w": 253}, {"t": "Creator selection: at least 18 paid creators, and the six I studied closely", "p": [{"en": "I found at least 18 paid creators. By paid I mean an ad label or a tracked link. This table shows six of them, the ones whose videos I could study.", "zh": "我找到了至少 18 位付费博主。我说的付费，是指有广告标签或者专属链接。这张表放的是其中 6 位，是我能仔细看视频的。"}, {"en": "Five of the six are comedy creators. RTGame built the death park I saw on Douyin. DanTDM has about 29 million subscribers, and his video went out just before Christmas. outsidexbox is a UK channel and HeyCara is a smaller one, and both posted the next summer. The last row, Let's Game It Out, I'll come to in a moment.", "zh": "6 位里有 5 位是搞笑博主。RTGame 建了我在抖音上看到的那座死亡乐园。DanTDM 有大约 2,900 万订阅，他的视频在圣诞节前发。outsidexbox 是英国频道，HeyCara 是个小一些的频道，两位都是第二年夏天发的。最后一行的 Let's Game It Out，我马上会讲。"}, {"en": "Under the table, box one is why comedy fits. I think their viewers come to watch a game go wrong, and a park builder gives them plenty to break.", "zh": "表格下面，第 1 格讲为什么搞笑博主合适。我觉得他们的观众就是来看游戏出乱子的，而建游乐园的游戏有大把东西可以玩坏。"}, {"en": "Box two is the one streamer, CohhCarnage. He streamed on launch day and plays properly for hours. I think that suits people who are deciding whether to buy.", "zh": "第 2 格是唯一的一位主播 CohhCarnage。他在发售当天直播，会认真玩好几个小时。我觉得这适合正在考虑买不买的人。"}, {"en": "Box three is everyone else. The other twelve paid creators were mostly Twitch streams I can't replay. Separately, 13 creators were hosted at a Thorpe Park event before launch. UK rules treat an invite as payment too, so their posts also need an Ad label. I keep them apart from the 18 because none of their posts has a sponsored label or a tracked link.", "zh": "第 3 格是其他人。另外 12 位付费博主大多是 Twitch 直播，现在回看不了。还有一批是另算的：13 位博主在发售前被请去参加了 Thorpe Park 的活动。英国的规则把邀请也算作报酬，所以他们的帖子同样要标 Ad。我把他们和这 18 位分开，是因为他们的帖子都没有赞助标签，也没有专属链接。"}, {"en": "Box four is the choice I liked most. Let's Game It Out got a free key in late November and made a video on his own. It has about 7.7 million views now. Three weeks later Frontier paid him to stream the first DLC, and in March they paid him again for a video on the third update. So they saw he liked the game before they paid him.", "zh": "第 4 格是我最喜欢的一个选择。Let's Game It Out 11 月底拿到免费 key，自己做了一条视频，现在大约 770 万播放。三周后 Frontier 付钱请他直播第一个 DLC，第二年 3 月又付钱请他做第三次更新的视频。也就是说，他们先看到他喜欢这个游戏，才付的钱。"}], "w": 282}, {"t": "Creative example: the new feature was the joke", "p": [{"en": "This is that video, Let's Game It Out's paid video for the third update. It has about 8.8 million views now.", "zh": "这就是那条视频，Let's Game It Out 为第三次更新做的付费视频，现在大约 880 万播放。"}, {"en": "Box one is what I liked. Frontier wanted to show one new feature. If a water slide is too steep, guests now fly off it. At 5:26 he runs the same slide twice. You can see both on the left. With the feature off, the guest slides down safely. With it on, the guest gets thrown off. That's the product demo, and it's the funniest moment in the video.", "zh": "第 1 格是我喜欢的地方。Frontier 想展示一个新功能：水滑梯太陡的话，游客会飞出去。5:26 他把同一条滑梯跑了两次，左边能看到这两种情况。功能关着，游客安全滑到底。功能开着，游客被甩出去。这就是产品演示，也是全片最好笑的地方。"}, {"en": "Box two is why it worked. He says it's sponsored in the first few seconds, and after that he never stops for an ad read. The feature is part of the joke, so people remember it.", "zh": "第 2 格是它为什么有效。他开头几秒就说了这是赞助，之后一次也没停下来念广告。新功能就是笑点的一部分，所以观众记得住。"}, {"en": "Boxes three and four. He builds a whole park in the video, so you see a lot of the game too. And I think the brief was one feature and a lot of freedom. That's my guess.", "zh": "第 3、4 格。他在视频里建了一整座乐园，所以你也看到了游戏的很多内容。我猜 brief 只要求展示一个功能，其余自由发挥。这是我猜的。"}, {"en": "At the bottom are two more examples. Frontier asked RTGame for a family friendly park, and he built a death park. And at Thorpe Park, 13 creators rode a real coaster blindfolded, then rebuilt it in the game from memory. In all three cases the fun part is also the product demo, so the creator never has to stop and sell.", "zh": "最下面还有两个例子。Frontier 请 RTGame 建一个适合全家玩的乐园，他建了一个死亡乐园。在 Thorpe Park，13 位博主蒙着眼坐真的过山车，然后凭记忆在游戏里把它建出来。这三个例子的共同点是：好玩的那部分本身就是产品演示，所以博主不用停下来推销。"}], "w": 225}, {"t": "Campaign beats: after launch, paid creators came with a DLC, an update or a sale", "p": [{"en": "On the left is the timeline. The first two rows are press beats, the announcement in July 2024 and pre-orders in September.", "zh": "左边是时间线。前两行是媒体做的节点：2024 年 7 月公布，9 月预购。"}, {"en": "Row three is the Thorpe Park event in October. Its numbers are in box one on the right. 13 creators and 11 press outlets made 53 pieces of content. I found 17 of the creator posts, with about 343,000 views in total. That's small next to one paid video at 8.8 million, so I read the event as a way to get press and interest before launch. Steam followers grew 2.8 times faster in those two weeks, with no sale and no update. I can't see Frontier's ads or where Steam featured the game, so I can't put that down to creators alone.", "zh": "第三行是 10 月的 Thorpe Park 活动，它的数字在右边第 1 格。13 位博主和 11 家媒体一共产出 53 条内容。我找到了其中 17 条博主的帖子，合计约 34.3 万次观看。和一条 880 万的付费视频比，这很小，所以我把这次活动看成发售前拿媒体报道和关注度的办法。那两周 Steam 关注数的增长速度是之前的 2.8 倍，期间没有打折也没有更新。Frontier 的广告和 Steam 的推荐位我看不到，所以这个增长不能只算在博主头上。"}, {"en": "The yellow rows are launch week. There were five paid Twitch streams, with four streamers building one park in a relay, and RTGame's video.", "zh": "黄色的两行是发售周。有 5 场付费 Twitch 直播，其中 4 位主播接力建同一座乐园，还有 RTGame 的视频。"}, {"en": "The pink rows are after launch, and this is where it changes. Almost every paid creator came with a reason to come back. In December it was the first DLC and a sale, with seven paid Twitch streams and DanTDM's video. In March it was the third update, with Let's Game It Out's paid video. In July it was a summer sale, with TikTok ads and two YouTube videos. The last row is the exception. outsidexbox and HeyCara posted after that sale had ended.", "zh": "粉色的几行是发售后，从这里开始就不一样了。几乎每一位付费博主都带着一个让玩家回来的理由。12 月是第一个 DLC 加打折，有 7 场付费 Twitch 直播和 DanTDM 的视频。3 月是第三次更新，有 Let's Game It Out 的付费视频。7 月是夏季打折，有 TikTok 广告和两条 YouTube 视频。最后一行是例外：outsidexbox 和 HeyCara 是在那次打折结束之后发的。"}, {"en": "Box two on the right is reviews. In the first 30 days, 68% were positive. After the third update it was 83%. I think the updates did that. My guess is the creator videos helped people hear about them.", "zh": "右边第 2 格是评价。头 30 天好评率 68%。第三次更新之后是 83%。我认为这是更新带来的。我猜博主的视频帮着让大家知道了这些更新。"}, {"en": "Box three is the beat I'd copy. In March Frontier paid Let's Game It Out again to show the third update, and that one video got about 2 million views in six days. I'd change one thing. Put the update, the sale and the video on the same day.", "zh": "第 3 格是我会照搬的节点。3 月 Frontier 再次付钱请 Let's Game It Out 展示第三次更新，这一条视频 6 天就有约 200 万播放。我只改一处：把更新、打折和视频放在同一天。"}], "w": 321}, {"t": "Platform approach: each platform had its own job", "p": [{"en": "The table on the left shows what each platform did. YouTube had most of the paid views I could count, about 10 million across seven videos. A building game needs time, and a long video can go from an empty field to a disaster. Twitch was for launch week and the first DLC. I think that was for people who wanted to watch normal play before buying. TikTok had 12 paid posts that I found. Instagram was small, with one cross-posted ad and one collab with a family creator.", "zh": "左边的表是每个平台做了什么。我能数到的付费播放大部分在 YouTube，7 条视频合计约 1,000 万。建造游戏需要时间才讲得清楚，一条长视频可以从一块空地讲到一场灾难。Twitch 用在发售周和第一个 DLC，我觉得那是给想先看正常玩法再决定买不买的人看的。TikTok 我找到 12 条付费帖子。Instagram 很少，只有一条搬运过来的广告，和一次与亲子博主的合作。"}, {"en": "Box two is the surprise. Those 12 paid TikToks had about 3.4 million views together. In the same search I found one fan's water park build with 14.5 million.", "zh": "第 2 格是一个意外。那 12 条付费 TikTok 加起来约 340 万播放。同一次搜索里，我找到一位粉丝建的水上乐园，一条就有 1,450 万。"}, {"en": "The table on the right puts them side by side. The fan video has likes at 4.7% of views, and the top paid posts are under 0.5%. The fan account had about 21,000 followers and it wasn't an ad. It also didn't name the game. I read 140 of its comments, and 19 were asking what the game was called.", "zh": "右边的表把两边放在一起比。粉丝视频的点赞是播放的 4.7%，播放最高的几条付费帖子都不到 0.5%。粉丝的账号只有约 2.1 万粉丝，也不是广告。它也没写游戏名。我读了它的 140 条评论，有 19 条在问这是什么游戏。"}, {"en": "The pink box is what I take from it. The most-watched TikToks I found for this game came from fans. So I'd find them, pay for the right to use their clips, run them as Spark Ads, and put the game's name on screen.", "zh": "粉色框是我的结论。我找到的这款游戏播放最高的 TikTok 是粉丝做的。所以我会找到他们，付钱买下片段的使用权，用 Spark Ads 投出去，并把游戏名字打在画面上。"}], "w": 222}, {"t": "Assessment: what worked, what didn't, and how I'd measure it", "p": [{"en": "First, the results, across the top. It topped the Steam chart at launch. Frontier's annual report says it passed 600,000 copies by September 2025. And the agency reports a reach of 23 million across Twitch, YouTube and TikTok.", "zh": "先说结果，在最上面一排。发售时登上 Steam 榜单第一。Frontier 年报说，到 2025 年 9 月卖了 60 万份以上。代理公司给的数是 Twitch、YouTube 和 TikTok 合计触达 2,300 万。"}, {"en": "Nobody outside Frontier can see sales per creator. So I checked what I could by day: Steam players, reviews, price, and Google searches.", "zh": "Frontier 以外的人看不到每个博主带来多少销量。所以我把能查的都按天查了一遍：Steam 的在线人数、评论、价格，还有 Google 搜索量。"}, {"en": "On the left, three things worked. One, creators got people looking. The day after the 8.8 million-view video, YouTube searches for the game were higher than on any other day from March to mid-April.", "zh": "左边，有三件事做对了。第一，博主让人开始搜这个游戏。那条 880 万播放的视频上线第二天，这款游戏的 YouTube 搜索量到了 3 月到 4 月中旬的最高点。"}, {"en": "Two, the best video kept working for months. On day six it had 2 million views, and now it has 8.8 million. A typical creator video gets about 60% of its views in the first week, and this one got 23%. So I wouldn't judge a creator on a first-week report. I'd check again at 60 to 90 days.", "zh": "第二，最好的那条视频持续起作用好几个月。第 6 天它有 200 万播放，现在是 880 万。一般的博主视频在第一周就拿到约 60% 的播放，这条只拿到 23%。所以我不会只凭第一周的报告来判断一位博主，我会在 60 到 90 天后再看一次。"}, {"en": "Three, tying videos to updates and sales. On SteamDB's daily chart, every rise in players I could see lines up with an update, a DLC or a discount. My data isn't complete, though. I can't see Frontier's own ads or where Steam featured the game, and both could have moved it too.", "zh": "第三，把视频和更新、促销绑在一起。SteamDB 每日在线人数图上，我能看到的每一次上涨，都对得上一次更新、一个 DLC 或一次打折。当然我的数据也不全，有些因素我看不到，比如 Frontier 自己投的广告，或者 Steam 首页有没有推荐这款游戏，这些都可能有影响。"}, {"en": "On the right, the pink box is the main problem. Frontier's biggest video and its sale missed each other by eight days. By the time the video went out, the discount had ended, and average players that week were 14% lower than the week before.", "zh": "右边，粉色框是最主要的问题。Frontier 最大的那条视频和它的促销错开了 8 天。视频发出来的时候打折已经结束，那一周的在线人数比前一周少了 14%。"}, {"en": "Below it are four weak spots, each with what I'd do. One, three of the six paid videos after launch week went out after a sale had ended. I'd lock the update, the sale and the video to the same day when we book. Two, none of the six paid videos I studied taught the game, and 23% of negative reviews from new players mention confusing tools or the tutorial. I'd pay one creator to teach it around each update. Three, one fan's TikTok got about four times the views of all 12 paid ones. I'd pay fans for their clips. Four, it's hard to prove what creators added. In the July TikTok week players rose 12%, and the first Planet Coaster rose 10% with no paid creators that I found. I'd test creators in one EMEA market against one that got nothing.", "zh": "粉色框下面是四个弱点，每个都配了我会怎么做。第一，发售周之后的 6 条付费视频里，有 3 条发在打折结束之后。我会在预约博主时就把更新、打折和视频锁在同一天。第二，我细看的 6 条付费视频没有一条教这个游戏，而新玩家写的差评里有 23% 提到工具难懂或教程不好。每次更新我会请一位教人玩的博主。第三，一位粉丝的 TikTok，播放是 12 条付费 TikTok 加起来的约 4 倍。我会付钱买粉丝的片段。第四，很难证明博主到底多带来了什么。7 月投 TikTok 那一周在线人数涨了 12%，而我没找到付费博主的初代 Planet Coaster 也涨了 10%。我会先在 EMEA 的一个市场投博主，再和没投的市场比。"}, {"en": "Bottom left, the metrics. I'd look at three things in order. First views, against the median of that creator's long videos. Then interest, so searches and wishlists. Then sales through links and codes, plus the lift over two normal weeks before we start.", "zh": "左下角是指标。我会按顺序看三样。先看播放，和这位博主长视频的播放中位数比。再看兴趣，也就是搜索量和愿望单。最后看销量：链接和代码带来的份数，再加上比开始前两个平常的星期多出来的部分。"}], "w": 406}, {"t": "For SEGA: Two Point Museum, with one more audience and one new idea", "p": [{"en": "For SEGA I picked Two Point Museum. I've played Two Point Campus and loved the silly courses like Knight School. The facts are across the top. The latest pack, Rides & Relics, came out on 8 October and adds rides and coasters, so I think Planet Coaster players would like it. Two Point's roadmap from 20 November lists the next beats. Twitch Drops start on 1 December, then a free update, then its biggest DLC early next year.", "zh": "SEGA 这边我选 Two Point Museum。我玩过 Two Point Campus，很喜欢 Knight School 这种搞笑课程。基本信息在最上面一排。最新的 DLC Rides & Relics 10 月 8 日上线，加了游乐设施和过山车，所以我觉得 Planet Coaster 的玩家会喜欢。Two Point 11 月 20 日的路线图列了接下来的节点：12 月 1 日开始 Twitch Drops，然后是一次免费更新，明年初是它最大的 DLC。"}, {"en": "On the left is the first thing I'd do, which is check a creator before booking again. SEGA has already paid creators for this game. I built a small tool called Creator Signal that compares a sponsored video with that creator's normal views. Real Civil Engineer's video got about 1.6 times his normal views, and ambiguousamphibian's about 0.6 times. Normal means the median views of their long videos.", "zh": "左边是我会做的第一件事：再请一位博主之前先查一查。SEGA 已经付钱请过博主推这款游戏。我做了一个小工具，叫 Creator Signal，把赞助视频和这位博主平时的播放量做对比。Real Civil Engineer 那条是他平时的约 1.6 倍，ambiguousamphibian 那条约 0.6 倍。「平时」指他们长视频播放量的中位数。"}, {"en": "On the right, three audiences. Two Point fans are covered, because SEGA already books comedy and management creators. Theme park fans are partly covered. For them I'd copy Frontier's idea. Give comedy creators one new Rides & Relics coaster to break, and add one creator who shows how to build it.", "zh": "右边是三类观众。Two Point 的粉丝已经覆盖到了，因为 SEGA 已经在请搞笑和经营类博主。游乐园爱好者覆盖了一部分。对他们我会照搬 Frontier 的做法：给搞笑博主一个 Rides & Relics 里的新过山车去玩坏，再加一位演示怎么建的博主。"}, {"en": "The yellow row is museum and history fans. They already make videos about this game unpaid. I found a palaeontologist and a museum worker doing it, and I couldn't find any that SEGA has paid. I'd book ten small history channels to react to the exhibits. I'd host them at a real museum first, the way Frontier used Thorpe Park. On a small budget that's the Pitt Rivers Museum in Oxford, and on a bigger one it's a stand at a Science Museum Lates night. SEGA did a venue tie-in like this in Japan last year, with an aquarium in Yokohama.", "zh": "黄色那一行是博物馆和历史爱好者。他们已经在自发做这款游戏的视频，没人付钱。我找到一位古生物学者和一位博物馆员工在做，也没找到 SEGA 付费请过的。我会请 10 个小型历史频道来点评游戏里的展品。我会先把他们请到一家真的博物馆，就像 Frontier 用 Thorpe Park 那样。预算小就用牛津的 Pitt Rivers Museum，预算大就在 Science Museum 的 Lates 夜场摆一个摊位。SEGA 去年在日本做过一次这样的场馆联动，对象是横滨的一家水族馆。"}, {"en": "The pink box is one new idea. Two Point already puts guest content in the museum. Fish from DREDGE, another game, came in a free update in August 2025. I'd make one exhibit with a history YouTuber and ask Two Point Studios to build it into a free update. Every creator gets their own code, and the plaque says \"Donated by\" and the name of whoever's code you used. So every creator gets their name in the museum, and a reason to keep pushing their code.", "zh": "粉色框是一个新点子。Two Point 本来就会把别人的内容放进博物馆，另一款游戏 DREDGE 的鱼就是 2025 年 8 月随免费更新进来的。我想和一位历史类 YouTuber 一起做一件展品，请 Two Point Studios 把它做进一次免费更新。每位博主有自己的代码，牌子上写「Donated by」加上你用的那个代码的博主名字。这样每位博主的名字都能进博物馆，他们也就有理由一直推自己的代码。"}], "w": 382}, {"t": "For SEGA: free keys first, pay for what works, and measure it properly", "p": [{"en": "Box one is an example budget of £40,000. I priced each line with public rates. £15,000 goes to theme park and building creators on YouTube. At 8 to 10 US cents a view, that's about three full videos, booked for the next free update with a sale on the same day. £13,000 goes to history creators when the exhibit goes in. That's ten small channels, because Balinoff says you need at least ten videos before you judge a type of creator.", "zh": "第 1 格是一个 4 万英镑的预算示例。每一行我都是按公开报价算的。1.5 万英镑给 YouTube 上的游乐园和建造类博主。按每次播放 8 到 10 美分，大约是 3 条完整视频，约在下一次免费更新，并让打折在同一天开始。1.3 万英镑在展品上线时给历史类博主。这是 10 个小频道，因为 Balinoff 说至少要 10 条视频才能判断一类博主行不行。"}, {"en": "£4,000 goes to Twitch, for the Twitch Drops that start on 1 December. £3,000 is a small TikTok test, paying fans for their clips and running them as Spark Ads.", "zh": "4,000 英镑给 Twitch，配合 12 月 1 日开始的 Twitch Drops。3,000 英镑是一个小规模的 TikTok 测试：付钱买粉丝的片段，用 Spark Ads 投出去。"}, {"en": "The yellow row is £5,000 that I'd hold back. If a Spark Ad takes off, I can put more spend behind it straight away. If a creator beats their normal views, I can book them again.", "zh": "黄色那一行是我先留着的 5,000 英镑。如果某条 Spark Ad 起量了，我可以马上追加投放。如果某位博主的播放超过他平时的水平，我可以再约他一次。"}, {"en": "Box two is how I'd book, and I'd copy Frontier here too. Send free keys first, watch who makes something good, pay them for the next update, then count the results.", "zh": "第 2 格是我会怎么请博主，这里我也照搬 Frontier。先送免费 key，看谁做出好内容，下一次更新付钱请他们，然后数结果。"}, {"en": "On the right, box three is how I'd measure it. I'd use the same three metrics as on the last slide. I'd count new and existing players separately, because a new player buys the game and an existing player only buys the pack. And every paid or hosted post says \"Ad\" at the start. At Thorpe Park, only five of the ten guests I found wrote it.", "zh": "右边第 3 格是我会怎么衡量。我会用上一页那三个指标。新玩家和老玩家分开数，因为新玩家买的是整个游戏，老玩家只买 DLC。每一条付费或受邀的帖子都在开头写 \"Ad\"。Thorpe Park 那次，我找到的 10 位来宾里只有 5 位写了。"}, {"en": "Box four is what I'd need from other teams. Keys and sale dates from Product Marketing. Two Point Studios to build the exhibit, and Studio Brand to approve it. And Community to tell me which fans already post about the game.", "zh": "第 4 格是我需要其他团队提供什么。Product Marketing 给 key 和打折日期。Two Point Studios 做展品，Studio Brand 审批。Community 告诉我哪些粉丝已经在发这款游戏的内容。"}, {"en": "That's my plan. Happy to take questions.", "zh": "这就是我的方案，欢迎提问。"}], "w": 293}];
let i=0, deck=null, t0=null, s0=null;
const $=id=>document.getElementById(id), main=$('main');
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function render(){
  $('num').textContent=(i+1)+' / '+D.length; $('title').textContent=D[i].t+'  ·  about '+(D[i].w/140).toFixed(1)+' min';
  main.innerHTML=D[i].p.map(p=>{ const m=p.en.match(/^(.{0,60}?[.,:])\s/); 
    return '<p>'+p.en.replace(/^((?:On the (?:left|right)[^.,]*|Under the table, box \w+|Box(?:es)? \w+(?: and \w+)?(?: on the right)?|The (?:pink|yellow) (?:box|rows?)|The table on the (?:left|right)|Row three|Bottom left|At the bottom|Below it|First, the results, across the top|The facts are (?:on the left|across the top)))/,'<b>$1</b>')+'</p><p class="zh">'+p.zh+'</p>'; }).join('');
  main.scrollTop=0; fit(); s0=Date.now();
}
function fit(){ let lo=13, hi=Math.min(34, innerWidth/18); for(let k=0;k<9;k++){ const m=(lo+hi)/2; main.style.fontSize=m+'px'; if(main.scrollHeight>main.clientHeight+1) hi=m; else lo=m; } main.style.fontSize=lo+'px'; }
function go(n,fromDeck){ if(n<0||n>=D.length) return; if(t0===null) t0=Date.now(); i=n; render(); if(!fromDeck&&deck&&!deck.closed) deck.postMessage({type:'go',i:n},'*'); }
addEventListener('keydown',e=>{ if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){ e.preventDefault(); go(i+1); } if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(i-1); } });
$('next').onclick=()=>go(i+1); $('prev').onclick=()=>go(i-1);
main.addEventListener('click',e=>{ const x=e.clientX/innerWidth; if(x>.8) go(i+1); else if(x<.2) go(i-1); });
$('zhBtn').onclick=()=>{ document.body.classList.toggle('zh'); $('zhBtn').classList.toggle('on'); fit(); };
$('resetBtn').onclick=()=>{ t0=null; s0=Date.now(); tick(); };
$('deckBtn').onclick=()=>{ deck=window.open('index.html','sega_deck','width=1280,height=760'); $('deckBtn').classList.add('on'); $('deckBtn').textContent='Deck open'; setTimeout(()=>{ if(deck) deck.postMessage({type:'go',i:i},'*'); },2500); };
addEventListener('message',e=>{ if(e.data&&e.data.type==='at'&&typeof e.data.i==='number'&&e.data.i>=0&&e.data.i!==i) go(e.data.i,true); });
function tick(){ const now=Date.now(); $('slideT').textContent=mmss(s0?(now-s0)/1000:0); const tot=t0?(now-t0)/1000:0; $('totalT').textContent='total '+mmss(tot); $('totalT').classList.toggle('over',tot>15*60); $('slideT').classList.toggle('over', s0&&(now-s0)/1000>D[i].w/140*60*1.15); }
setInterval(tick,500); addEventListener('resize',fit); render();
</script></body></html>

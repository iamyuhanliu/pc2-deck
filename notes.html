<script>
const D=[{"t": "Planet Coaster 2 let creators break the game, and kept going after launch", "p": [{"en": "I found this game on Douyin, China's TikTok. Someone had reposted a few seconds of a guy building a theme park that kills all its guests. I laughed, and I went and played it. The game was Planet Coaster 2, and the clip came from a paid video by RTGame.", "zh": "我是在抖音上发现这款游戏的。有人搬运了几秒钟的片段，一个人在建一座会把游客全弄死的游乐园。我看笑了，就去玩了。这款游戏就是 Planet Coaster 2，那条片段来自 RTGame 的一条付费视频。"}, {"en": "That clip is the idea behind this whole presentation. In a building game, the clips that travel are the funny moments, like a guest flying off a slide. You get them in two seconds, even if you've never played. Careful builds mostly stay with people who already play. I'll show you the numbers behind that on page 5.", "zh": "这条片段就是我整个演示的核心。在建造类游戏里，能传开的是好笑的瞬间，比如游客从滑梯上飞出去。就算从没玩过，两秒钟也能看懂。认真的建造，大多只在本来就玩的人里传。第 5 页我会拿数字给你们看。"}, {"en": "Planet Coaster 2 is a theme park builder from Frontier in Cambridge. It came out in November 2024, and the launch was rough. I counted the Steam reviews from the first 30 days, and only 68% were positive. So creators had to reach people who'd never sit through a building video, on top of the theme park fans who were waiting anyway.", "zh": "Planet Coaster 2 是剑桥的 Frontier 做的游乐园建造游戏，2024 年 11 月发售，发售时口碑不太好。我数了头 30 天的 Steam 评测，好评只有 68%。所以博主除了本来就在等的游乐园粉丝，还要拉来那些根本不会看建造视频的人。"}, {"en": "I liked this campaign because Frontier kept going after launch. I found at least 18 paid creators, and two thirds of them posted after launch week, around a DLC, an update or a sale.", "zh": "我喜欢这次 campaign，是因为 Frontier 发售后没有停。我找到至少 18 位付费博主，三分之二是在发售周之后，围绕 DLC、更新或打折发的。"}], "w": 204}, {"t": "Creator selection: at least 18 paid creators, and the six I studied closely", "p": [{"en": "Frontier paid at least 18 creators. I found them by checking each video description for an ad label, and for Frontier's tracked links, which all start with fron.dev.", "zh": "Frontier 至少付钱请了 18 位博主。我是这样找的：逐条看视频简介里有没有广告标注，有没有 Frontier 的专属链接（都以 fron.dev 开头）。"}, {"en": "The table shows the six whose videos I could study. Five are comedy channels. Their viewers come to watch a game go wrong. The sixth, CohhCarnage, plays properly for hours on launch day, for people deciding whether to buy.", "zh": "表里是我能细看视频的 6 位。5 位是搞笑频道，观众就是来看游戏被玩坏的。第 6 位 CohhCarnage 在发售日认真玩好几个小时，给还在考虑买不买的人看。"}, {"en": "One thing in the numbers surprised me. Channel size didn't predict views. DanTDM has about 29 million subscribers, and his paid video got about 700,000 views. That's around 2% of his subscribers. Let's Game It Out has 6.5 million subscribers, and his paid video got 8.8 million, more than his whole subscriber count. So I'd book creators on how their videos perform, and I'd ignore subscriber numbers.", "zh": "数字里有一点让我意外：频道大小预测不了播放。DanTDM 有大约 2,900 万订阅，他的付费视频大约 70 万播放，只有订阅数的 2% 左右。Let's Game It Out 有 650 万订阅，付费视频 880 万播放，比他的订阅数还多。所以我会按博主视频的实际表现来约人，不看订阅数。"}, {"en": "He's also my favourite choice. In late November nobody was paying him. He got a free key, made a video on his own, and it has 7.7 million views. Three weeks later Frontier paid him to stream the first DLC, and in March they paid him again. They watched him make funny moments first, and then they paid.", "zh": "他也是我最喜欢的选择。11 月底没人付钱给他，他拿到一个免费 key，自己做了一条视频，现在 770 万播放。三周后 Frontier 付钱请他直播第一个 DLC，3 月又付了一次。他们先看到他能做出好笑的瞬间，然后才付钱。"}], "w": 192}, {"t": "Creative example: the new feature was the joke", "p": [{"en": "This is the moment I liked most. It's Let's Game It Out's paid video for the third update, and it has 8.8 million views.", "zh": "这是我最喜欢的一个瞬间。这是 Let's Game It Out 为第三次更新做的付费视频，880 万播放。"}, {"en": "Frontier wanted to show one new feature. If a water slide is too steep or too fast, guests get launched off it. So at 11:01 he builds a roller coaster to catch a flying guest in mid-air. The guest flies off the slide, the coaster races past, and it scoops up his inner tube and leaves him behind. That's the product demo, and it's also the funniest moment in the video.", "zh": "Frontier 想展示一个新功能：水滑梯太陡或太快，游客就会被甩出去。所以在 11:01，他建了一条过山车，想在半空接住飞出来的游客。游客从滑梯上飞出去，过山车冲过去，只捞走了他的皮圈，把人留在半空。这就是产品演示，也是整条视频最好笑的地方。"}, {"en": "I timed the video. The sponsor mention takes about 25 seconds at the start, and he never stops for an ad read after that. The new slides are on screen for about ten of the fifteen minutes. He didn't need an ad read, because the feature was the joke.", "zh": "我给视频计了时。开头讲赞助大约 25 秒，之后一次也没停下来念广告。新滑梯在 15 分钟里出现了大约 10 分钟。他不需要念广告，因为新功能本身就是笑点。"}, {"en": "Nobody teaches you to build in it, though.", "zh": "不过视频里没人教你怎么建。"}, {"en": "My guess is the brief was one feature and a lot of freedom. Frontier did the same before launch. At Thorpe Park, 13 creators rode a real coaster blindfolded and then rebuilt it in the game from memory. Both times Frontier set up the moment, and the creators made it funny.", "zh": "我猜 brief 就是一个要展示的功能，加上很大的自由度。Frontier 在发售前也这样做过。在 Thorpe Park，13 位博主蒙着眼坐真的过山车，再凭记忆在游戏里建出来。两次都是 Frontier 把瞬间设计好，博主把它变好笑。"}], "w": 203}, {"t": "Campaign beats: after launch, paid creators came with a DLC, an update or a sale", "p": [{"en": "On the timeline, every update gave creators something new to break.", "zh": "时间线上能看出来，每次更新都给了博主一个可以玩坏的新东西。"}, {"en": "Before launch it was press and Thorpe Park. Dead Good, the agency that ran the event, says 13 creators and 11 outlets made 53 pieces. I found 17 of the creator posts, and together they had about 343,000 views. The biggest had 61,000. That's small next to one paid video at 8.8 million, so I read the event as a way to get press and wishlists. On SteamDB, Steam followers grew 2.8 times faster from 11 to 25 October than in the ten days before, with no sale or update. I can't see Frontier's ads, so I won't give creators all the credit.", "zh": "发售前主要是媒体和 Thorpe Park。办活动的代理公司 Dead Good 说，13 位博主和 11 家媒体一共产出了 53 条内容。我找到了其中 17 条博主帖子，加起来大约 34.3 万播放，最高一条 6.1 万。和一条 880 万的付费视频比，这很小，所以我认为这个活动主要是为了拿媒体报道和愿望单。在 SteamDB 上，10 月 11 日到 25 日 Steam 关注数的增长速度是之前 10 天的 2.8 倍，当时没有打折也没有更新。我看不到 Frontier 投了多少广告，所以不会把功劳全算在博主头上。"}, {"en": "After launch, the first DLC in December, the third update in March and the summer sale in July each came with paid creators. The game got better too. I grouped 15,301 Steam reviews by the date they were written. They were 68% positive in the first 30 days, and 83% after the third update.", "zh": "发售后，12 月第一个 DLC、3 月第三次更新、7 月夏季打折，每次都有付费博主跟着发。游戏本身也变好了。我把 15,301 条 Steam 评测按写的日期分组，头 30 天好评 68%，第三次更新后是 83%。"}, {"en": "The one thing I'd fix is timing. The Update 3 video came out eight days after the sale ended. Picture someone watching it, opening Steam, and finding the full price. I'd put the update, the sale and the video on the same day.", "zh": "我唯一想改的是时机。Update 3 的视频在打折结束 8 天后才发。想象一下，有人看完视频打开 Steam，看到的是原价。我会把更新、打折和视频放在同一天。"}], "w": 211}, {"t": "Platform approach: each platform had its own job", "p": [{"en": "The platforms tell the same story. YouTube had most of the paid views, about 10 million across seven videos. A long video gives the moment a story, from an empty field to a disaster. Twitch was for people who wanted to watch before buying. On TikTok I searched in four rounds with 37 search terms and found 12 paid posts, about 3.4 million views together.", "zh": "各个平台也是同一个规律。YouTube 占了大部分付费播放，7 条视频大约 1,000 万。长视频能给瞬间配一个故事，从一片空地拍到一场灾难。Twitch 给想先看再买的人。TikTok 我分四轮、用 37 个搜索词找，找到 12 条付费帖子，加起来大约 340 万播放。"}, {"en": "Instagram is where I found the clearest proof. This account, blueprint_fail2, has 33,000 followers. It only posts water slides from the rider's seat, with titles like \"You won't believe what this slide did to me\". I took the median of its last 24 reels, and it's about 300,000 views, nine times its follower count. Its biggest got 56 million. The account at the bottom of the table makes careful, realistic coasters, and its median is 7,200.", "zh": "最清楚的证据在 Instagram。这个账号 blueprint_fail2 只有 3.3 万粉丝，只发第一视角的水滑梯，标题像「你不会相信这条滑梯对我做了什么」。我取了它最近 24 条 reels 播放的中位数，大约 30 万，是粉丝数的 9 倍。最高一条 5,600 万。表格最下面那个账号做的是认真的仿真过山车，中位数是 7,200。"}, {"en": "Then I searched Instagram for Planet Coaster 2 and sorted the first 45 posts by caption. The 8 funny ones had a median of about 33,000 likes. The 33 careful builds had 161. That's about 200 times more. The sample isn't random, so I read it as a pattern.", "zh": "然后我在 Instagram 搜 Planet Coaster 2，把前 45 条帖子按文案分类。8 条搞笑的，点赞中位数大约 3.3 万；33 条认真建造的只有 161。差了大约 200 倍。样本不是随机的，所以我把它看成一个规律。"}, {"en": "So I'd find the accounts already making these clips, pay for the rights, and run them as Spark Ads and Reels ads with the game's name on screen.", "zh": "所以我会找到已经在做这种片段的账号，付钱买使用权，用 Spark Ads 和 Reels 广告投出去，把游戏名字打在画面上。"}], "w": 218}, {"t": "Assessment: what worked, what didn't, and how I'd measure it", "p": [{"en": "Frontier says it sold over 600,000 copies by September 2025. Nobody outside Frontier can see sales by creator, so I checked what I could by day, with SteamDB, Google Trends and the Steam reviews.", "zh": "Frontier 说到 2025 年 9 月卖了 60 万份以上。Frontier 以外的人看不到每个博主卖了多少，所以我用 SteamDB、Google Trends 和 Steam 评测，按天查了能查到的。"}, {"en": "Three things worked. The day after the 8.8 million video, Google Trends showed more YouTube searches for the game than on any other day from March to mid-April. The web archive shows that video had about 2 million views on day six, only 23% of what it has now. A mobile games podcast by Marion Balinoff says a creator video usually gets about 60% in its first seven days. So I'd judge a creator at 60 to 90 days. And every rise in players I could see on SteamDB lined up with an update, a DLC or a discount.", "zh": "有三点起作用了。那条 880 万的视频发出第二天，Google Trends 上这款游戏的 YouTube 搜索量是 3 月到 4 月中旬里最高的一天。网页存档显示，这条视频第 6 天大约 200 万播放，只是现在的 23%。Marion Balinoff 的手游营销播客说，博主视频通常头 7 天就拿到 60% 左右的播放。所以我会在 60 到 90 天后再评估博主。另外在 SteamDB 上，我能看到的每一次在线人数上涨，都对得上一次更新、一个 DLC 或一次打折。"}, {"en": "The pink box is the main miss, the eight days. Below it are three more. None of the paid videos taught the game. I read the negative reviews from players with under five hours, and 217 of 956, about a quarter, say the tools or the tutorial are confusing. So I'd add one creator who teaches. Short clips were left to others, so I'd pay for them. And I can't prove what creators added. In the July TikTok week players rose 12%, and two other Frontier games on sale that week rose 10% and 4% with no creators. So I'd test creators in one market and compare with one that got nothing.", "zh": "粉色框是最主要的失误，就是那 8 天。下面还有三个。付费视频没有一条教人玩。我读了游戏时长不到 5 小时的玩家写的差评，956 条里有 217 条，大约四分之一，说工具或教程看不懂。所以我会加一位教人玩的博主。短视频交给了别人，所以我会付钱买。还有，我证明不了博主到底多带来了多少。7 月 TikTok 那一周在线人数涨了 12%，但同一周打折、没有博主的另外两款 Frontier 游戏也涨了 10% 和 4%。所以我会先在一个市场投博主，和一个什么都没投的市场比。"}, {"en": "For metrics I'd keep three. Views against the creator's normal, interest like searches and wishlists, and sales through links and codes.", "zh": "指标我只看三个：播放和博主平时的水平比，兴趣看搜索量和愿望单，销量看链接和代码。"}], "w": 266}, {"t": "For SEGA: Two Point Museum's next DLC, built on funny moments", "p": [{"en": "For SEGA I'd take this to Two Point Museum's next DLC. I checked the official roadmap from 20 November. Twitch Drops start on 1 December, then there's a free update, and early next year comes what they call their biggest DLC yet. The theme isn't public, so I'm assuming one headline feature, like every pack before it.", "zh": "放到 SEGA，我会用在 Two Point Museum 的下一个 DLC 上。我看了 11 月 20 日发的官方路线图：12 月 1 日开始 Twitch Drops，然后是一次免费更新，明年初上线官方说的「我们最大的 DLC」。主题还没公布，所以我假设它和之前每个 DLC 一样，有一个主打的新功能。"}, {"en": "Two Point is already a comedy game, so funny moments fit it even better than Planet Coaster. Step one is to find the funny moment. I'd ask the studio which part of the new feature goes wrong in a funny way by design, so it looks like a joke and doesn't look like a bug. Then I'd give it to comedy creators.", "zh": "Two Point 本来就是搞笑游戏，所以好笑的瞬间和它比和 Planet Coaster 更配。第一步是找到那个好笑的瞬间。我会问工作室，新功能里哪部分是设计好会出好笑状况的，这样看起来是笑点，不像 bug。然后交给搞笑博主。"}, {"en": "Before I book anyone again, I'd check them with Creator Signal. It's a small tool I built. It compares a sponsored video with the median views of that creator's normal long videos. SEGA's two paid creators on this game came out at 1.6 times and 0.6 times their normal. That's what I'd check before rebooking either of them.", "zh": "再约任何人之前，我会先用 Creator Signal 查一下。这是我自己做的小工具，它拿一条赞助视频和这个博主平时长视频的播放中位数比。SEGA 为这款游戏请过的两位博主，分别是平时的 1.6 倍和 0.6 倍。再约他们之前，我会先看这个。"}, {"en": "There's one more group with its own funny moments. History and museum people already post about this game for free, like a palaeontologist reacting to its fossils. I'd book ten small history channels, and host them at a real museum first, the way Frontier used Thorpe Park. The Pitt Rivers Museum in Oxford hires out from £600 an hour.", "zh": "还有一群人有他们自己的好笑瞬间。历史和博物馆圈的人已经在免费发这款游戏的内容了，比如一位古生物学者点评游戏里的化石。我会约 10 个小型历史频道，先把他们请到一家真的博物馆，就像 Frontier 用 Thorpe Park 那样。牛津的 Pitt Rivers 博物馆每小时 £600 起租。"}], "w": 236}, {"t": "For SEGA: free keys first, pay for what works, and measure it properly", "p": [{"en": "Free keys go out first, and I watch who makes a funny moment people share, the way Frontier did with Let's Game It Out. Then I pay.", "zh": "先发免费 key，看谁做出了大家愿意转发的好笑瞬间，就像 Frontier 对 Let's Game It Out 那样。然后再付钱。"}, {"en": "This example budget is £40,000, and I priced each line from public rates. Gamesight's public rate for YouTube is 8 to 10 US cents a view. So £15,000 buys about three full videos from comedy channels averaging 70,000 views, and £13,000 covers ten history channels averaging 19,000. Twitch is priced per viewer per hour, so £4,000 is about four two-hour streams with 500 viewers each, for the Drops.", "zh": "这个示例预算是 4 万英镑，每一行我都按公开价格算的。Gamesight 公开的 YouTube 价格是每次播放 8 到 10 美分。所以 1.5 万英镑大约能买 3 条完整视频，频道平均播放 7 万；1.3 万给 10 个历史频道，平均播放 1.9 万。Twitch 按每位观众每小时算价，所以 4,000 英镑大约是 4 场 2 小时的直播，每场 500 人看，配合 Drops。"}, {"en": "£3,000 is for short clips. TikTok and Instagram Reels use the same vertical format, and most TikTok creators also run Instagram. So when I book a TikTok creator, I'd add a small fee to post the same clip as a Reel.", "zh": "3,000 用在短视频上。TikTok 和 Instagram Reels 是同一种竖屏格式，大部分 TikTok 博主也有 Instagram。所以签 TikTok 博主时，我会多加一点钱，让他把同一条也发到 Reels。"}, {"en": "I'd keep £5,000 back. Balinoff says only about three in ten creator videos pay back, so I want money ready for the ones that do.", "zh": "我会留 5,000。Balinoff 说博主视频大约十条里只有三条能回本，所以要留钱给回本的那几条。"}, {"en": "The update, the sale and the videos go out on the same day, and the date and the Ad label go in every contract. Of the ten Thorpe Park guests whose posts I found, only five wrote Ad, and the CMA now counts an event invite as payment.", "zh": "更新、打折和视频放在同一天发，日期和 Ad 标注写进每一份合同。Thorpe Park 那批我找到帖子的 10 位博主里，只有 5 位写了 Ad；而 CMA 现在把活动邀请也算作付费。"}, {"en": "I'd need keys and sale dates from Product Marketing, the studio to point me to the funny moment, Studio Brand to approve it, and Community to point me to the accounts already making clips.", "zh": "这些需要 Product Marketing 给 key 和打折日期，工作室告诉我好笑的瞬间在哪，Studio Brand 审核，Community 告诉我哪些账号已经在做这种片段。"}, {"en": "That's my plan. Happy to take questions.", "zh": "这就是我的方案，欢迎提问。"}], "w": 250}];
let i=0, deck=null, t0=null, s0=null;
const $=id=>document.getElementById(id), main=$('main');
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function render(){
  $('num').textContent=(i+1)+' / '+D.length; $('title').textContent=D[i].t+'  ·  about '+(D[i].w/140).toFixed(1)+' min';
  main.innerHTML=D[i].p.map(p=>{ const m=p.en.match(/^(.{0,60}?[.,:])\s/); 
    return '<p>'+p.en.replace(/^((?:On the (?:left|right)[^.,]*|Under the table, box \w+|Box(?:es)? \w+(?: and \w+)?(?: on the right)?|The (?:pink|yellow) (?:box|rows?)|The table on the (?:left|right)|Row three|Bottom left|At the bottom|Below it|First, the results, across the top|The facts are (?:on the left|across the top)))/,'<b>$1</b>')+'</p><p class="zh">'+p.zh+'</p>'; }).join('');
  main.scrollTop=0; fit(); s0=Date.now();
}
function fit(){ let lo=13, hi=Math.min(34, innerWidth/18); for(let k=0;k<9;k++){ const m=(lo+hi)/2; main.style.fontSize=m+'px'; if(main.scrollHeight>main.clientHeight+1) hi=m; else lo=m; } main.style.fontSize=lo+'px'; }
function go(n,fromDeck){ if(n<0||n>=D.length) return; if(t0===null) t0=Date.now(); i=n; render(); if(!fromDeck&&deck&&!deck.closed) deck.postMessage({type:'go',i:n},'*'); }
addEventListener('keydown',e=>{ if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){ e.preventDefault(); go(i+1); } if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(i-1); } });
$('next').onclick=()=>go(i+1); $('prev').onclick=()=>go(i-1);
main.addEventListener('click',e=>{ const x=e.clientX/innerWidth; if(x>.8) go(i+1); else if(x<.2) go(i-1); });
$('zhBtn').onclick=()=>{ document.body.classList.toggle('zh'); $('zhBtn').classList.toggle('on'); fit(); };
$('resetBtn').onclick=()=>{ t0=null; s0=Date.now(); tick(); };
$('deckBtn').onclick=()=>{ deck=window.open('index.html','sega_deck','width=1280,height=760'); $('deckBtn').classList.add('on'); $('deckBtn').textContent='Deck open'; setTimeout(()=>{ if(deck) deck.postMessage({type:'go',i:i},'*'); },2500); };
addEventListener('message',e=>{ if(e.data&&e.data.type==='at'&&typeof e.data.i==='number'&&e.data.i>=0&&e.data.i!==i) go(e.data.i,true); });
function tick(){ const now=Date.now(); $('slideT').textContent=mmss(s0?(now-s0)/1000:0); const tot=t0?(now-t0)/1000:0; $('totalT').textContent='total '+mmss(tot); $('totalT').classList.toggle('over',tot>15*60); $('slideT').classList.toggle('over', s0&&(now-s0)/1000>D[i].w/140*60*1.15); }
setInterval(tick,500); addEventListener('resize',fit); render();
</script></body></html>

<script>
const D=[{"t": "Planet Coaster 2 let creators break the game, and kept going after launch", "p": [{"en": "Hi everyone, thank you for having me today. I'm Yuhan, and the campaign I picked is for Planet Coaster 2.", "zh": "大家好，谢谢你们今天邀请我。我是 Yuhan，我选的是 Planet Coaster 2 的 campaign。"}, {"en": "I came across this game about a year ago on Douyin, China's TikTok. Someone had reposted a few seconds of a guy building a theme park that kills all its guests. I thought it was so funny that I went and played it. The game was Planet Coaster 2, and the clip came from a paid video by RTGame.", "zh": "我大概一年前在抖音（中国的 TikTok）上刷到这款游戏。有人搬运了几秒钟的片段，一个人在建一座会把游客全弄死的游乐园。我觉得太好笑了，就去玩了。这款游戏就是 Planet Coaster 2，那条片段来自 RTGame 的一条付费视频。"}, {"en": "That clip is the idea behind this whole presentation. In a building game, the clips that travel are the funny moments, like a guest flying off a slide. You get them in two seconds, even if you've never played. Careful builds mostly stay with people who already play.", "zh": "这条片段就是我整个演示的核心。在建造类游戏里，能传开的是好笑的瞬间，比如游客从滑梯上飞出去。就算从没玩过，两秒钟也能看懂。认真的建造，大多只在本来就玩的人里传。"}, {"en": "Planet Coaster 2 is a theme park builder from Frontier in Cambridge. It came out in November 2024. I think the campaign was for two groups. Theme park fans, who were waiting for the sequel anyway, and people who'd never sit through a building video but would laugh at a park going wrong. At launch, the goal was to reach that second group.", "zh": "Planet Coaster 2 是剑桥的 Frontier 做的游乐园建造游戏，2024 年 11 月发售。我认为这次 campaign 面向两类人：一类是本来就在等续作的游乐园粉丝；另一类是不会耐心看建造视频、但看到乐园出乱子会笑的人。发售时的目标是触达第二类人。"}, {"en": "After launch, I think the goal was to bring players back and keep the game selling. Most players drift away after launch week, so each update and DLC gave them a reason to come back, and Frontier paid creators to make each new feature funny. In the end it worked, and that's why I liked this campaign.", "zh": "发售后，我猜目标是把玩家拉回来，让游戏一直有销量。大部分玩家在发售周之后就慢慢走了，所以每次更新和 DLC 都给了他们一个回来的理由，Frontier 也每次付钱请博主把新功能玩出笑点。最后效果很好，这就是我喜欢这次 campaign 的原因。"}], "w": 247}, {"t": "Creator selection: at least 18 paid creators, and the six I studied closely", "p": [{"en": "Next is creator selection. By paid, I mean the post has an ad label or one of Frontier's tracked links, which all start with fron.dev. By that rule I found at least 18 paid creators. The table shows the six whose videos I could study. As you can see, five of them are comedy channels, so Frontier bet on funny moments. Their viewers come to watch a game go wrong. The sixth, CohhCarnage, plays properly for hours on launch day, for people deciding whether to buy.", "zh": "接下来是博主选择。我说的「付费」，是指帖子有广告标注，或者有 Frontier 的专属链接（都以 fron.dev 开头）。按这个标准，我找到至少 18 位付费博主。表里是我能细看视频的 6 位。可以看到，其中 5 位是搞笑频道，所以 Frontier 押的就是好笑的瞬间。他们的观众就是来看游戏被玩坏的。第 6 位 CohhCarnage 在发售日认真玩好几个小时，给还在考虑买不买的人看。"}, {"en": "The creator I found most interesting is Let's Game It Out. He's a YouTuber, and his channel is built on breaking simulation games. At first, nobody was paying him. He got a free key and made a video on his own, which now has 7.7 million views. Three weeks later, Frontier paid him to stream the first DLC, and in March they paid him again. They watched him make funny moments first, and then they paid.", "zh": "我觉得最有意思的博主是 Let's Game It Out。他是 YouTuber，频道就是专门把模拟类游戏玩坏的。一开始没人付钱给他，他拿到一个免费 key，自己做了一条视频，现在 770 万播放。三周后 Frontier 付钱请他直播第一个 DLC，3 月又付了一次。他们先看到他能做出好笑的瞬间，然后才付钱。"}, {"en": "His numbers show why. His two videos on this game have about 16.5 million views. The other five paid videos in this table have about 1.3 million together.", "zh": "他的数字能说明原因。他在这款游戏上的两条视频加起来大约 1,650 万播放，表里另外 5 条付费视频加起来只有大约 130 万。"}], "w": 190}, {"t": "Creative example: the new feature was the joke", "p": [{"en": "This is the funny moment I liked most. It's Let's Game It Out's paid video for the third update, with 8.8 million views.", "zh": "这是我最喜欢的一个好笑瞬间。这是 Let's Game It Out 为第三次更新做的付费视频，880 万播放。"}, {"en": "Frontier wanted to show one new feature. If a water slide is too steep or too fast, guests get launched off it. So he built a roller coaster to catch them in mid-air. Let me play it.", "zh": "Frontier 想展示一个新功能：水滑梯太陡或太快，游客就会被甩出去。所以他建了一条过山车，想在半空把人接住。我放给大家看。"}, {"en": "[Play from 10:40 to about 11:05.]", "zh": "[从 10:40 放到 11:05 左右。]"}, {"en": "The first try fails. On the second, the coaster races past and grabs only his inner tube. That's the product demo, and it's the funniest moment in the video.", "zh": "第一次没接住。第二次过山车冲过去，只捞走了他的皮圈。这就是产品演示，也是整条视频最好笑的地方。"}, {"en": "I timed it. The sponsor mention takes about 25 seconds at the start, and he never stops for an ad read after that. The new slides are on screen for about ten of the fifteen minutes. He didn't need an ad read, because the feature was the joke.", "zh": "我给视频计了时。开头讲赞助大约 25 秒，之后一次也没停下来念广告。新滑梯在 15 分钟里出现了大约 10 分钟。他不需要念广告，因为新功能本身就是笑点。"}, {"en": "The video doesn't teach you to build, though. I'll come back to that on page 6.", "zh": "不过这条视频不教你怎么建。第 6 页我会再说这一点。"}, {"en": "My guess is the brief was one feature and a lot of freedom. Frontier did the same before launch. At Thorpe Park, 13 creators rode a real coaster blindfolded and then rebuilt it in the game from memory. Both times Frontier set up the moment, and the creators made it funny.", "zh": "我猜 brief 就是一个要展示的功能，加上很大的自由度。Frontier 在发售前也这样做过。在 Thorpe Park，13 位博主蒙着眼坐真的过山车，再凭记忆在游戏里建出来。两次都是 Frontier 把瞬间设计好，博主把它变好笑。"}], "w": 210}, {"t": "Campaign beats: after launch, paid creators came with a DLC, an update or a sale", "p": [{"en": "On the timeline, every update gave creators a new thing to break.", "zh": "时间线上能看出来，每次更新都给了博主一个可以玩坏的新东西。"}, {"en": "Before launch, Frontier took 13 creators to Thorpe Park. I found 17 of their posts, and together they got about 343,000 views. So I think the event was mostly for press and wishlists.", "zh": "发售前，Frontier 带 13 位博主去了 Thorpe Park。我找到了他们的 17 条帖子，加起来大约 34.3 万播放。所以我觉得这个活动主要是为了拿媒体报道和愿望单。"}, {"en": "After launch, every big moment came with paid creators. The first DLC in December, the third update in March, and the summer sale in July.", "zh": "发售后，每个重要节点都有付费博主跟着发：12 月第一个 DLC、3 月第三次更新、7 月夏季打折。"}, {"en": "The part I'd copy is in the pink box. In March, Frontier paid Let's Game It Out again to show Update 3. That one video got about 2 million views in six days. The agency says the whole launch campaign got 1.7 million on YouTube and Twitch. So one funny video beat the whole launch campaign in less than a week.", "zh": "我最想照搬的是粉色框里这一步。3 月，Frontier 又付钱请 Let's Game It Out 做 Update 3 的视频。这一条视频 6 天就有大约 200 万播放。代理公司说，整个发售期 campaign 在 YouTube 和 Twitch 上一共 170 万。也就是说，一条搞笑视频不到一周，就超过了整个发售 campaign。"}, {"en": "There's one thing I'd fix. That video came out eight days after the sale ended. So people laughed, opened Steam, and saw the full price. Next time I'd put the update, the sale and the video on the same day.", "zh": "有一点我会改。这条视频是打折结束 8 天后才发的。大家笑完打开 Steam，看到的是原价。下次我会把更新、打折和视频放在同一天。"}], "w": 171}, {"t": "Platform approach: each platform had its own job", "p": [{"en": "For platforms, this table shows who posted where.", "zh": "平台方面，这张表是谁在哪个平台发了什么。"}, {"en": "YouTube carried most of the paid views, about 10 million across seven videos, from RTGame at launch to Let's Game It Out in March. A long video can build up to the funny moment, and people still find it months later.", "zh": "YouTube 占了大部分付费播放，7 条视频大约 1,000 万，从发售时的 RTGame 到 3 月的 Let's Game It Out。长视频可以一步步铺垫到那个好笑的瞬间，几个月后还有人搜到。"}, {"en": "Twitch was for people deciding whether to buy. CohhCarnage streamed on launch day, four streamers built one park in a relay, and for the first DLC Let's Game It Out and six others streamed with Twitch Drops.", "zh": "Twitch 给正在考虑买不买的人看。CohhCarnage 发售日直播，四位主播接力建一座乐园；第一个 DLC 时，Let's Game It Out 和另外六位主播配合 Twitch Drops 直播。"}, {"en": "TikTok had 12 paid posts, about 3.4 million views together, mostly in launch week and the July sale. Instagram had just two. madmorph reposted his paid TikTok, and allthatisshe made a collab. A few creators covered two platforms with one piece, like jillyeon and outsidexbox on YouTube and TikTok.", "zh": "TikTok 有 12 条付费帖子，加起来大约 340 万播放，大多在发售周和 7 月打折期间。Instagram 只有两条：madmorph 把他的付费 TikTok 转发了过来，allthatisshe 做了一次合作。有几位博主一条内容发了两个平台，比如 jillyeon 和 outsidexbox 在 YouTube 和 TikTok 都发了。"}, {"en": "On short video, the biggest clips had no paid label. This reel, from an account with 33,000 followers, got 56 million views. This careful build got 7,700. In a search for the game, the funny posts had about 200 times the likes of the careful builds.", "zh": "短视频上，播放最高的片段都没有付费标注。这条 reel 来自一个 3.3 万粉丝的账号，5,600 万播放。这条认真建造的只有 7,700。在 Instagram 搜这款游戏，搞笑帖子的点赞是认真建造帖子的大约 200 倍。"}, {"en": "So I'd find the accounts already making these clips, pay for the rights, and run them as Spark Ads and Reels ads with the game's name on screen.", "zh": "所以我会找到已经在做这种片段的账号，付钱买使用权，用 Spark Ads 和 Reels 广告投出去，把游戏名字打在画面上。"}], "w": 209}, {"t": "Assessment: what worked, and what I'd improve", "p": [{"en": "For results, Frontier says it sold over 600,000 copies by September 2025. Nobody outside Frontier can see sales by creator, so I checked what I could by day, with Google Trends, SteamDB, the web archive and the Steam reviews.", "zh": "结果方面，Frontier 说到 2025 年 9 月卖了 60 万份以上。Frontier 以外的人看不到每个博主卖了多少，所以我用 Google Trends、SteamDB、网页存档和 Steam 评测，按天查了能查到的。"}, {"en": "Three things worked. The day after the coaster video went up, YouTube searches for the game hit their highest point from March to mid-April. The video also kept travelling. On day six it had about 2 million views, only 23% of what it has now. And on SteamDB, players rose with every update, DLC and discount, so the clips work best when they land on one of those days.", "zh": "有三点起作用了。过山车那条视频发出第二天，这款游戏的 YouTube 搜索量到了 3 月到 4 月中旬的最高点。这条视频还一直在传，第 6 天大约 200 万播放，只是现在的 23%。另外在 SteamDB 上，在线人数每逢更新、DLC 和打折就涨，所以片段落在这些日子上效果最好。"}, {"en": "Two things I'd improve. The pink box is the main one. The coaster video came out eight days after the sale ended, so people laughed and then saw the full price. I'd put the update, the sale and the video on the same day, and lock that date when we book.", "zh": "有两点我会改进。粉色框是最主要的：过山车视频在打折结束 8 天后才发，大家笑完看到的是原价。我会把更新、打折和视频放在同一天，签约时就锁定日期。"}, {"en": "The second is teaching. The funny clips brought people in, and then nobody taught them to play. About a quarter of the negative reviews from players with under five hours say the tools or the tutorial are confusing. So I'd add one creator who teaches.", "zh": "第二点是教人玩。好笑的片段把人带进来了，之后却没人教他们怎么玩。游戏时长不到 5 小时的玩家写的差评里，大约四分之一说工具或教程看不懂。所以我会加一位教人玩的博主。"}], "w": 204}, {"t": "Metrics: how I'd know the funny moments worked", "p": [{"en": "For metrics, I'd measure three things, in this order. I tried each one on Planet Coaster 2 with free tools, so I know what you can see from outside.", "zh": "指标方面，我会按顺序看三件事。每一项我都用免费工具在 Planet Coaster 2 上试过，所以知道从外面能看到什么。"}, {"en": "First, whether the moment travelled. I'd compare each video with that creator's normal views, and look at shares, because a funny clip spreads through shares. For that I built Creator Signal. For SEGA's two paid creators on Two Point Museum, one got 1.6 times his normal views and the other got 0.6 times. For views on a given day I used the web archive, and for Twitch, SullyGnome shows watch time by channel.", "zh": "第一，这个瞬间有没有传开。我会把每条视频和这个博主平时的播放比，再看分享，因为好笑的片段是靠分享传开的。为此我做了 Creator Signal。SEGA 为 Two Point Museum 请过的两位博主，一位拿到平时播放的 1.6 倍，另一位是 0.6 倍。某一天的播放我用网页存档查，Twitch 用 SullyGnome 看每个频道的观看时长。"}, {"en": "Second, whether people got curious. Google Trends shows searches by day and by country. SteamDB shows Steam followers, which is the closest public sign of wishlists. And I'd read the comments for people asking what the game is.", "zh": "第二，大家有没有好奇。Google Trends 能按天、按国家看搜索量。SteamDB 能看 Steam 关注数，这是愿望单在公开数据里最接近的信号。我还会看评论里有没有人问「这是什么游戏」。"}, {"en": "Third, whether it sold, or brought players back. SteamDB has daily players and price history. I also sorted 15,301 Steam reviews by date and hours played, to see when new players arrived.", "zh": "第三，有没有卖出去，或者把玩家拉回来。SteamDB 有每天的在线人数和价格历史。我还把 15,301 条 Steam 评测按日期和游戏时长排了一遍，看新玩家是什么时候来的。"}, {"en": "From inside, SEGA can add the rest. Each creator's own analytics, visits from each tracked link, and sales by link and code. And I'd check everything again at 60 to 90 days, because the coaster video had only 23% of its views by day six.", "zh": "SEGA 在内部可以补上剩下的：博主自己的后台数据、每条专属链接带来的访问、按链接和代码算的销量。所有指标我都会在 60 到 90 天后再看一次，因为过山车那条视频到第 6 天只有 23% 的播放。"}], "w": 217}, {"t": "For SEGA: what I'd take into Two Point Museum's next DLC", "p": [{"en": "For SEGA, I'd take this into Two Point Museum's next DLC. The roadmap from 20 November says it's coming early next year, and it's their biggest yet. Two Point is already a comedy game, so funny moments fit it even better than Planet Coaster.", "zh": "放到 SEGA，我会用在 Two Point Museum 的下一个 DLC 上。11 月 20 日的路线图说它明年初上线，是他们最大的一个 DLC。Two Point 本来就是搞笑游戏，所以好笑的瞬间和它比和 Planet Coaster 更配。"}, {"en": "The table shows what I learned and what I'd do with it. The feature was the joke, so I'd ask the studio which part of the new feature goes wrong in a funny way, and build every brief around it. Frontier gave a free key before it paid, so I'd send keys to comedy creators first and pay the ones whose moment travels. The biggest video missed its sale, so the DLC, the sale and the videos go out on the same day. The funniest short clips came from small accounts, and this role runs TikTok's Gaming Incentive Programme, so the funny moment goes into that brief and the best clips get Spark Ads. And I'd add one creator who teaches.", "zh": "表格左边是我学到的，右边是我会怎么做。新功能就是笑点，所以我会问工作室，新功能里哪部分是设计好会出好笑状况的，每份 brief 都围绕它写。Frontier 先给了免费 key 再付钱，所以我会先给搞笑博主发 key，谁的瞬间传开了再付钱。最大的那条视频错过了打折，所以 DLC、打折和视频放在同一天。最好笑的短视频来自小账号，而这个岗位负责 TikTok 的 Gaming Incentive Programme，所以这个好笑的瞬间写进它的 brief，表现最好的片段再投 Spark Ads。另外我会加一位教人玩的博主。"}, {"en": "On the right are the creators I'd brief. Along with comedy creators, I'd add history creators, because the exhibits are silly takes on real fossils, and an expert's reaction is a funny moment too.", "zh": "右边是我会请的博主。除了搞笑博主，我还会加历史博主，因为游戏里的展品都是真实化石的搞笑版本，专家看到它们的反应本身就是一个好笑的瞬间。"}, {"en": "For this I'd need keys and sale dates from Product Marketing, the funny moment from the studio, approval from Studio Brand, and Community to point me to the accounts already making clips.", "zh": "这些需要 Product Marketing 给 key 和打折日期，工作室告诉我好笑的瞬间在哪，Studio Brand 审核，Community 告诉我哪些账号已经在做这种片段。"}, {"en": "That's my plan. Happy to take questions.", "zh": "这就是我的方案，欢迎提问。"}], "w": 238}];
let i=0, deck=null, t0=null, s0=null;
const $=id=>document.getElementById(id), main=$('main');
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function render(){
  $('num').textContent=(i+1)+' / '+D.length; $('title').textContent=D[i].t+'  ·  about '+(D[i].w/140).toFixed(1)+' min';
  main.innerHTML=D[i].p.map(p=>{ const m=p.en.match(/^(.{0,60}?[.,:])\s/); 
    return '<p>'+p.en.replace(/^((?:On the (?:left|right)[^.,]*|Under the table, box \w+|Box(?:es)? \w+(?: and \w+)?(?: on the right)?|The (?:pink|yellow) (?:box|rows?)|The table on the (?:left|right)|Row three|Bottom left|At the bottom|Below it|First, the results, across the top|The facts are (?:on the left|across the top)))/,'<b>$1</b>')+'</p><p class="zh">'+p.zh+'</p>'; }).join('');
  main.scrollTop=0; fit(); s0=Date.now();
}
function fit(){ let lo=13, hi=Math.min(34, innerWidth/18); for(let k=0;k<9;k++){ const m=(lo+hi)/2; main.style.fontSize=m+'px'; if(main.scrollHeight>main.clientHeight+1) hi=m; else lo=m; } main.style.fontSize=lo+'px'; }
function go(n,fromDeck){ if(n<0||n>=D.length) return; if(t0===null) t0=Date.now(); i=n; render(); if(!fromDeck&&deck&&!deck.closed) deck.postMessage({type:'go',i:n},'*'); }
addEventListener('keydown',e=>{ if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){ e.preventDefault(); go(i+1); } if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(i-1); } });
$('next').onclick=()=>go(i+1); $('prev').onclick=()=>go(i-1);
main.addEventListener('click',e=>{ const x=e.clientX/innerWidth; if(x>.8) go(i+1); else if(x<.2) go(i-1); });
$('zhBtn').onclick=()=>{ document.body.classList.toggle('zh'); $('zhBtn').classList.toggle('on'); fit(); };
$('resetBtn').onclick=()=>{ t0=null; s0=Date.now(); tick(); };
